<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>RDOC – Statistiken</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="rdoc-brand.css">
<link rel="stylesheet" href="rdoc-admin.css">
</head>
<body>
<script src="stats-shared.js"></script>

<div class="page-header">
  <div class="page-title">RDOC<span> //</span> <em>Statistiken</em></div>
</div>

<div class="tab-nav">
  <div class="nav-tab active" data-tab="walloffame" onclick="showTab('walloffame')">WALL OF FAME</div>
  <div class="nav-tab"        data-tab="fights"     onclick="showTab('fights')">KAMPF-HISTORIE</div>
</div>

<div class="tab-content">

  <!-- Wall of Fame -->
  <div class="tab-panel active" id="tab-walloffame">
    <div class="stat-row">
      <div class="stat-block">
        <div class="stat-val" id="ps-players">–</div>
        <div class="stat-lbl">PILOTEN</div>
      </div>
      <div class="stat-block">
        <div class="stat-val" id="ps-fights">–</div>
        <div class="stat-lbl">AUSGETRAGENE KÄMPFE</div>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn btn-struct" onclick="loadWallOfFame()">&#x21BB; AKTUALISIEREN</button>
    </div>
    <div class="section-title">WALL OF FAME</div>
    <table>
      <thead><tr>
        <th>#</th>
        <th>NAME</th>
        <th>SIEGE</th>
        <th>NIEDERLAGEN</th>
        <th>QUOTE</th>
        <th>LETZTER KAMPF</th>
      </tr></thead>
      <tbody id="walloffame-tbl"></tbody>
    </table>
  </div>

  <!-- Kampf-Historie -->
  <div class="tab-panel" id="tab-fights">
    <div class="toolbar">
      <button class="btn btn-struct" onclick="loadFights()">&#x21BB; AKTUALISIEREN</button>
    </div>
    <div class="section-title">KAMPF-HISTORIE</div>
    <table>
      <thead><tr>
        <th>SIEGER</th>
        <th>SCHIFF</th>
        <th>VERLIERER</th>
        <th>SCHIFF</th>
        <th>DATUM</th>
      </tr></thead>
      <tbody id="fights-tbl"></tbody>
    </table>
  </div>

</div>

<script src="stats.js"></script>
</body>
</html>
