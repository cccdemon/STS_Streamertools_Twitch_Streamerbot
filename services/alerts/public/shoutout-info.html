<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>RDOC – Shoutout</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="rdoc-brand.css">
<style>
  /* ────────────────────────────────────────────────────────────
     RDOC – Shoutout panel

     Brand layer: rdoc-brand.css, linked above; data-theme="dark"
     on <html> keeps an OBS light preference from flipping tokens.
     Palette literals (rgba() cannot take a variable): Space
     #121416, Graphite #2B3135, Off White #F2F2F0, Steel #76828D,
     Copper #C48A4A, Patina #4FB5B5.

     The raid panel and this one are the same object in two states,
     so they now share one colour role split instead of swapping
     the two accents: Copper labels the event, Patina is structure.
     No gradient, glow or text-shadow.
     ──────────────────────────────────────────────────────────── */

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: var(--rdoc-font-text);
  }

  #so-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 560px;
    height: 1080px;
    background: rgba(18,20,22,0.95);
    border-left: 1.5px solid rgba(79,181,181,0.45);
    pointer-events: none;
    opacity: 0;
    transform: translateX(40px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
  }

  #so-panel.active {
    opacity: 1;
    transform: translateX(0);
  }

  #so-panel::before, #so-panel::after {
    content: '';
    position: absolute;
    width: 40px;
    height: 40px;
    border-color: #C48A4A;
    border-style: solid;
  }

  #so-panel::before {
    top:-2px;
    left:-2px;
    border-width:3px 0 0 3px;
  }

  #so-panel::after {
    bottom:-2px;
    left:-2px;
    border-width:0 0 3px 3px;
  }

  .panel-corner-tr {
    position: absolute;
    top:-2px;
    right:-2px;
    width:40px;
    height:40px;
    border:3px solid #C48A4A;
    border-width:3px 3px 0 0;
  }

  .panel-corner-br {
    position: absolute;
    bottom:-2px;
    right:-2px;
    width:40px;
    height:40px;
    border:3px solid #C48A4A;
    border-width:0 3px 3px 0;
  }

  /* Flat hairlines - the old ones were four-stop gradients. */
  .panel-top-line {
    position: absolute;
    top:0;
    left:40px;
    right:40px;
    height:1px;
    background: #C48A4A;
    opacity: 0.6;
  }

  .panel-bottom-line {
    position: absolute;
    bottom:0;
    left:40px;
    right:40px;
    height:1px;
    background: #4FB5B5;
    opacity: 0.45;
  }

  /* Side bar: flat Patina, pulsing opacity only. */
  .panel-bar {
    position: absolute;
    top:60px;
    bottom:60px;
    left:-10px;
    width:2px;
    background: #4FB5B5;
    animation: barPulse 3s ease-in-out infinite;
  }

  @keyframes barPulse {
    0%,100% { opacity:0.4; }
    50% { opacity:1.0; }
  }

  /* Scanline texture removed - repeating gradient. */
  .panel-scan { display:none; }

  .so-label {
    font-family: var(--rdoc-font-mono);
    font-size: 12px;
    letter-spacing: 0.3em;
    color: #C48A4A;
    text-transform: uppercase;
    margin-bottom: 36px;
  }

  .so-avatar-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 32px;
  }

  .so-avatar-wrap::before,
  .so-avatar-wrap::after {
    content: '';
    position: absolute;
    width: 18px;
    height: 18px;
    border-color: #C48A4A;
    border-style: solid;
  }

  .so-avatar-wrap::before {
    top:-3px;
    left:-3px;
    border-width:3px 0 0 3px;
  }

  .so-avatar-wrap::after {
    bottom:-3px;
    right:-3px;
    border-width:0 3px 3px 0;
  }

  #soAvatar {
    width: 180px;
    height: 180px;
    border: 2px solid #4FB5B5;
    display: block;
    object-fit: cover;
  }

  /* Michroma: one cut, tracking 0, ~1.35x wider than the old
     Orbitron 900 - hence 30px instead of 38px. */
  #soName {
    font-family: var(--rdoc-font-display);
    font-size: 30px;
    color: #F2F2F0;
    letter-spacing: 0;
    text-align: center;
    line-height: 1.15;
    margin-bottom: 10px;
    word-break: break-word;
  }

  #soGame {
    font-family: var(--rdoc-font-mono);
    font-size: 14px;
    letter-spacing: 0.2em;
    color: #4FB5B5;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .panel-divider {
    width: 100%;
    height: 1px;
    background: #2B3135;
    margin-bottom: 28px;
  }

  .info-key {
    font-family: var(--rdoc-font-mono);
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #4FB5B5;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  /* A paragraph, so Plex Sans and not uppercased. */
  #soSummary {
    font-family: var(--rdoc-font-text);
    font-size: 19px;
    color: #F2F2F0;
    line-height: 1.6;
    text-align: left;
    width: 100%;
    word-break: break-word;
    white-space: pre-wrap;
  }

  #loadingDots {
    font-family: var(--rdoc-font-mono);
    font-size: 14px;
    letter-spacing: 0.2em;
    color: #4FB5B5;
    text-align: center;
    width: 100%;
    display: none;
  }

  #loadingDots.visible {
    display: block;
  }

  #soUrl {
    font-family: var(--rdoc-font-mono);
    font-size: 13px;
    letter-spacing: 0.2em;
    color: #76828D;
    margin-top: 28px;
    text-align: center;
    text-transform: lowercase;
  }

  #dbg {
    position: fixed;
    bottom: 12px;
    left: 12px;
    font-family: var(--rdoc-font-mono);
    font-size: 11px;
    color: #76828D;
    letter-spacing: 0.07em;
    pointer-events: none;
    z-index: 9999;
  }
</style>
</head>
<body>

<div id="so-panel">
  <div class="panel-corner-tr"></div>
  <div class="panel-corner-br"></div>
  <div class="panel-top-line"></div>
  <div class="panel-bottom-line"></div>
  <div class="panel-bar"></div>
  <div class="panel-scan"></div>

  <div class="so-label">// Shoutout</div>

  <div class="so-avatar-wrap">
    <img id="soAvatar" src="" alt="">
  </div>

  <div id="soName">—</div>
  <div id="soGame"></div>

  <div class="panel-divider"></div>

  <div style="width:100%">
    <div class="info-key">// Crew-Analyse</div>
    <div id="loadingDots">// analysiere signale ...</div>
    <div id="soSummary"></div>
  </div>

  <div id="soUrl"></div>
</div>

<div id="dbg"></div>

<script>
const params  = new URLSearchParams(location.search);

const panel     = document.getElementById('so-panel');
const elName    = document.getElementById('soName');
const elGame    = document.getElementById('soGame');
const elAvatar  = document.getElementById('soAvatar');
const elSummary = document.getElementById('soSummary');
const elLoading = document.getElementById('loadingDots');
const elUrl     = document.getElementById('soUrl');
const elDbg     = document.getElementById('dbg');

let hideTimer = null;

function dbg(msg) {
  elDbg.textContent = '// ' + msg;
  console.log('[ShoutoutInfo]', msg);
}

async function fetchTwitchUser(login) {
  const res = await fetch(`/alerts/api/twitch/user/${encodeURIComponent(login)}`);
  if (!res.ok) throw new Error(`API HTTP ${res.status}`);
  return await res.json();
}

// ── WEBSOCKET ──
let ws, reconnectDelay = 1000;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  dbg(`WS → ${proto}//${location.host}/alerts/ws`);
  ws = new WebSocket(`${proto}//${location.host}/alerts/ws`);

  ws.onopen = () => {
    reconnectDelay = 1000;
    dbg('WS verbunden ✓');
    ws.send(JSON.stringify({ event: 'cc_identify', role: 'shoutout-overlay' }));

    const test = params.get('test');
    if (test === 'shoutout') {
      setTimeout(() => handleShoutout({
        user:            params.get('user') || 'TestStreamer',
        game:            params.get('game') || 'Star Citizen',
        bio:             params.get('bio')  || 'Ein cooler Streamer aus dem Vers.',
        profileImageUrl: '',
      }), 800);
    }
  };

  ws.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);

      if (d.event === 'shoutout') handleShoutout(d);
      if (d.alertType === 'shoutout-panel') handleShoutout(d);
    } catch (_) {}
  };

  ws.onclose = () => {
    dbg(`WS getrennt – reconnect in ${reconnectDelay / 1000}s`);
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 10000);
  };

  ws.onerror = () => ws.close();
}

// ── HANDLE SHOUTOUT ──
async function handleShoutout(data) {
  const user   = data.user || 'Unbekannt';
  const game   = data.game || '';
  let bio      = data.bio || '';
  let avatar   = data.profileImageUrl || '';

  dbg(`Shoutout: ${user}`);

  clearTimeout(hideTimer);
  elSummary.textContent = '';
  elLoading.classList.remove('visible');

  elName.textContent = user;
  elGame.textContent = game ? `// ${game}` : '';
  elUrl.textContent  = `twitch.tv/${user.toLowerCase()}`;

  if (!avatar || !bio) {
    try {
      const tw = await fetchTwitchUser(user.toLowerCase());
      if (!avatar && tw.profile_image_url) avatar = tw.profile_image_url;
      if (!bio && tw.description) bio = tw.description;
      dbg(avatar ? 'Twitch User ✓' : 'Twitch User leer');
    } catch (err) {
      dbg(`Twitch User Fehler: ${err.message}`);
    }
  }

  if (avatar) {
    elAvatar.src = avatar;
    elAvatar.alt = user;
    elAvatar.style.display = 'block';
  } else {
    elAvatar.removeAttribute('src');
    elAvatar.style.display = 'none';
  }

  panel.classList.add('active');

  elLoading.classList.add('visible');
  const summary = await fetchSummary(user, game, bio);
  elLoading.classList.remove('visible');
  elSummary.textContent = summary;

  const url = `twitch.tv/${user.toLowerCase()}`;
  const prefix = `▶ Shoutout an ${user}! `;
  const suffix = ` → ${url}`;
  const maxSummary = 500 - prefix.length - suffix.length;
  const trimmed = summary.length > maxSummary
    ? summary.slice(0, maxSummary - 1) + '…'
    : summary;

  sendChat(prefix + trimmed + suffix);

  hideTimer = setTimeout(() => panel.classList.remove('active'), 15000);
}

// ── CLAUDE API (via server) ──
async function fetchSummary(user, game, bio) {
  try {
    const res = await fetch('/alerts/api/claude/summary', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'shoutout', user, game, bio }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    dbg('Claude ✓');
    return json.summary || buildFallback(user, game, bio);
  } catch (err) {
    dbg(`Claude Fehler: ${err.message}`);
    return buildFallback(user, game, bio);
  }
}

function buildFallback(user, game, bio) {
  const gameStr = game ? `Zuletzt aktiv in ${game}. ` : '';
  return `${gameStr}Schaut mal bei ${user} vorbei – lohnt sich!`;
}

function sendChat(message) {
  fetch('/alerts/api/chat/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message }),
  })
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    dbg('Chat gesendet ✓');
  })
  .catch(e => dbg(`Chat Fehler: ${e.message}`));
}

connect();
</script>
</body>
</html>
