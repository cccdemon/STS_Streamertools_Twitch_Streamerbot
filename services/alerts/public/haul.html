<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RDOC – Hauling</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="rdoc-brand.css">
<!--
  Hauling OBS-Overlay – grafische Untermalung des !haul Chatgames.
  Standalone: verbindet direkt zur Streamerbot-WS, sendet
  { event:'cc_haul_register' }, empfängt Spiel-Events (type:'haul')
  von Hauling.cs via cc_haul_session.

  OBS Browser-Source:  /alerts/haul.html        (live, transparent)
  Test im Browser:     /alerts/haul.html?demo=1 (feuert Beispiele)
  WS überschreiben:    ?sb=ws://host:port
-->
<style>
  /* ──────────────────────────────────────────────────────────
     RDOC – Hauling overlay

     Brand layer: rdoc-brand.css, linked above; data-theme="dark"
     stops an OBS light preference from flipping the tokens.

     How colour is spent on ONE haul
     -------------------------------
       - Signet    Copper, once, in the station ident. With the
                   jackpot tag this is the only Copper on screen.
       - Jackpot   Copper. It IS the primary event of the view, and
                   it is the one case where a Copper fill is allowed
                   (a surface made entirely of the primary action).
       - Lane, streak tag, card rule
                   Patina. Structure.
       - Win / loss / difficulty tier
                   Functional colours, each next to its own word:
                   LEICHT Success, MITTEL Info, SCHWER Warning,
                   EXTREM Error. The tier used to run
                   Success/Warning/COPPER/Error, which made a
                   difficulty read as the brand accent, and Copper
                   is not a state.
       - Everything else
                   Off White on Space, Steel for secondary.

     Gone already: every gradient (card, lane, tag fills), every
     box-shadow and text-shadow, every border-radius, the backdrop
     blur, and the synthetic weights - only Plex Sans 400/600 exist
     as real files, so 800/900 are out. Michroma has one cut and
     runs at tracking 0. Gone now: the 12px canvas shadowBlur that
     put a coloured bloom on every particle.

     The emoji are game DATA, not brand chrome: the job glyph, the
     rank badge and the tags arrive in the Streamerbot payload. The
     icon rules in chapter 15 govern the UI's own icons, and this
     overlay draws none.

     Local aliases only - rgba() cannot take a CSS variable, and
     OBS ships an older CEF than a desktop browser, so no
     color-mix() here either.
     ────────────────────────────────────────────────────────── */
  :root{
    --ink:#F2F2F0;
    --panel:rgba(18,20,22,.92);
    --line:rgba(43,49,53,1);
    --copper:#C48A4A;
    --patina:#4FB5B5;
    --ok:#63C271;
    --err:#EE6E76;
    --warn:#EBCF52;
    --info:#79AEDC;
    --steel:#76828D;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* Layout in 1080p-Koordinaten gebaut, per zoom auf 1440p (2560×1440) skaliert.
     OBS Browser-Source-Größe = 2560 × 1440 setzen. */
  html,body{width:2560px;height:1440px;overflow:hidden;background:transparent;
    font-family:var(--rdoc-font-text);color:var(--ink)}
  /* Canvas füllt die echte Auflösung (innerWidth/innerHeight) – kein Scaling. */
  #fx{position:fixed;inset:0;z-index:1;pointer-events:none}
  /* UI in 1080p-Koordinaten gebaut, per transform:scale auf 1440p skaliert. */
  #stage{position:fixed;top:0;left:0;width:1920px;height:1080px;z-index:2;
    pointer-events:none;transform:scale(1.3333);transform-origin:top left}

  /* ── Auftrags-Karte (Lower Third) ── */
  #card{
    position:absolute;left:50%;bottom:140px;transform:translate(-50%,160%);
    z-index:2;width:980px;min-height:150px;opacity:0;
    background:var(--panel);
    border:1px solid var(--line);border-left:3px solid var(--copper);
    padding:22px 30px;
    transition:transform .55s cubic-bezier(.16,1,.3,1),opacity .4s ease;
  }
  #card.show{transform:translate(-50%,0);opacity:1}
  /* Outcome reads on the left rule plus the result word - never colour alone. */
  #card.win{border-left-color:var(--ok)}
  #card.lose{border-left-color:var(--err)}

  .top{display:flex;align-items:center;gap:16px}
  .jobEmoji{font-size:56px;line-height:1}
  .meta{flex:1;min-width:0}
  /* A name is body voice. Plex Sans Semibold is a real cut and is
     how the kit emphasises inside body copy; Michroma has no bold. */
  .user{font-family:var(--rdoc-font-text);font-weight:600;font-size:24px;letter-spacing:0.02em}
  .user .badge{font-size:24px;margin-left:6px}
  .job{font-size:20px;color:var(--steel);margin-top:4px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .tier{display:inline-block;font-family:var(--rdoc-font-mono);font-size:13px;
    letter-spacing:.07em;text-transform:uppercase;
    padding:3px 9px;margin-left:8px;vertical-align:middle;
    border:1px solid currentColor}
  /* Difficulty is a state, so it takes functional colour and always
     carries its own word. SCHWER used to be Copper - a difficulty
     is not the primary action of the view. */
  .tier.LEICHT{color:var(--ok)}    .tier.MITTEL{color:var(--info)}
  .tier.SCHWER{color:var(--warn)}  .tier.EXTREM{color:var(--err)}

  .result{font-family:var(--rdoc-font-display);font-size:40px;letter-spacing:0;
    text-align:right;line-height:1.1;white-space:nowrap}
  .result.win{color:var(--ok)} .result.lose{color:var(--err)}

  .bottom{display:flex;align-items:center;justify-content:space-between;
    margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
    font-size:19px;color:var(--ink)}
  .tags{display:flex;gap:10px}
  .tag{font-family:var(--rdoc-font-mono);font-size:15px;letter-spacing:.07em;
    text-transform:uppercase;padding:4px 12px;border:1px solid currentColor;
    animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
  /* JACKPOT is the primary event of the view and takes the only
     Copper fill on the card. CRIT used to be Copper too, which put
     two accents side by side in the same tag row. */
  .tag.crit{color:var(--ink)}
  .tag.jackpot{color:var(--copper);background:rgba(196,138,74,.16)}
  .tag.ambush{color:var(--err)}
  .tag.streak{color:var(--patina)}
  .bal{font-family:var(--rdoc-font-mono);font-weight:400;color:var(--ink)}
  .bal small{font-family:var(--rdoc-font-mono);color:var(--steel);text-transform:uppercase;letter-spacing:.07em}

  /* ── Quantum-Lane + Frachtschiff (im #stage, 1080p-Koordinaten) ── */
  /* Flat 2px Patina rule - the lane was a five-stop gradient with a glow. */
  #road{position:absolute;left:0;right:0;bottom:120px;height:2px;opacity:0;
    background:var(--patina);transition:opacity .3s}
  #truck{position:absolute;bottom:104px;left:-180px;font-size:78px}

  /* Station ident. Where this overlay spends its signet: bottom
     left, under the lane, clear of the lower-third card. Standard
     cut at 34px - the mark is never rendered below 32px. */
  #ident{position:absolute;left:40px;bottom:36px;display:flex;align-items:center;gap:12px;opacity:.92}
  #ident .signet{display:block;width:34px;height:34px;flex-shrink:0;color:var(--copper)}
  #ident .signet svg{display:block;width:100%;height:100%}
  #ident .label{font-family:var(--rdoc-font-mono);font-size:12px;line-height:1.3;
    letter-spacing:.3em;text-transform:uppercase;color:var(--patina)}

  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes shake{10%,90%{transform:translate(-51%,2px)}30%,70%{transform:translate(-49%,-3px)}
    50%{transform:translate(-50%,3px)}}
  #card.crash{animation:shake .5s linear}

  /* Motion is a preference, not a decision the overlay makes. */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div id="stage">
    <div id="road"></div>
    <div id="truck">🚀</div>

    <div id="ident">
      <span class="signet" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="RDOC"><title>RDOC</title><g transform="translate(-60 -60) scale(0.3125)"><path fill="currentColor" d="M523.168,192.195 A320 320 0 0 1 784.845,344.8 L682.528,407.5 A200 200 0 0 0 518.98,312.122 Z M795.843,364.24 A320 320 0 0 1 799.614,652.279 L691.759,599.674 A200 200 0 0 0 689.402,419.65 Z M789.128,672 A320 320 0 0 1 657.277,797.122 L602.798,690.201 A200 200 0 0 0 685.205,612 Z M444.124,680 L579.876,680 L631.874,808.699 A320 320 0 0 1 586.703,823.158 L575.497,776.485 A272 272 0 0 0 589.252,772.799 L573.612,720 L450.388,720 L434.748,772.799 A272 272 0 0 0 448.503,776.485 L437.297,823.158 A320 320 0 0 1 392.126,808.699 Z M366.723,797.122 A320 320 0 0 1 234.872,672 L338.795,612 A200 200 0 0 0 421.202,690.201 Z M224.386,652.279 A320 320 0 0 1 228.157,364.24 L334.598,419.65 A200 200 0 0 0 332.241,599.674 Z M239.155,344.8 A320 320 0 0 1 500.832,192.195 L505.02,312.122 A200 200 0 0 0 341.472,407.5 Z"/></g></svg></span>
      <span class="label">RDOC // Hauling</span>
    </div>

    <div id="card">
      <div class="top">
        <div class="jobEmoji" id="jobEmoji">📦</div>
        <div class="meta">
          <div class="user" id="user">Spieler <span class="badge" id="badge">⚪</span></div>
          <div class="job"><span id="jobName">Auftrag</span><span class="tier" id="tier">LEICHT</span></div>
        </div>
        <div class="result" id="result">+0</div>
      </div>
      <div class="bottom">
        <div class="tags" id="tags"></div>
        <div class="bal" id="bal"><small>Konto</small> 0</div>
      </div>
    </div>
  </div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const SB = qs.get('sb') || 'ws://192.168.178.39:9090';
  const DEMO = qs.has('demo');

  const $ = id => document.getElementById(id);
  const card = $('card'), truck = $('truck'), road = $('road');

  // ── Canvas particles ──
  const cv = $('fx'), ctx = cv.getContext('2d');
  function resize(){ cv.width = innerWidth; cv.height = innerHeight; }
  resize(); addEventListener('resize', resize);

  let parts = [];
  function spawn(x, y, n, opts){
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, sp = opts.sp*(0.4+Math.random()*0.9);
      parts.push({
        x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - (opts.up||0),
        life: 1, decay: 0.008+Math.random()*0.014,
        size: opts.size*(0.6+Math.random()*0.8),
        g: opts.g==null?0.12:opts.g, color: opts.color,
        text: opts.text || null, rot: Math.random()*6, vr:(Math.random()-.5)*0.3
      });
    }
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for (let i=parts.length-1;i>=0;i--){
      const p = parts[i];
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.life -= p.decay; p.rot += p.vr;
      if (p.life<=0){ parts.splice(i,1); continue; }
      ctx.save(); ctx.globalAlpha = Math.max(0,p.life);
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      if (p.text){ ctx.font = `${p.size}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(p.text,0,0); }
      // Flat particle. shadowBlur is a canvas glow, and glow is out of
      // the identity - the particle reads on its own colour.
      else { ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(0,0,p.size,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    }
    requestAnimationFrame(tick);
  }
  tick();

  // ── Queue ──
  const queue = []; let busy = false;
  function enqueue(d){ queue.push(d); if(!busy) next(); }
  function next(){
    const d = queue.shift();
    if(!d){ busy=false; return; }
    busy = true; play(d).then(()=>setTimeout(next, 350));
  }

  // Particle palette: brand values only, same roles as the CSS above.
  const C = { green:'#63C271', red:'#EE6E76', gold:'#C48A4A', cyan:'#4FB5B5', ink:'#F2F2F0', steel:'#76828D' };

  function play(d){
    return new Promise(res => {
      const win = !!d.success;
      // fill card
      $('jobEmoji').textContent = d.emoji || (win?'📦':'💥');
      $('user').innerHTML = `${esc(d.user||'Spieler')} <span class="badge">${d.badge||'⚪'}</span>`;
      $('jobName').textContent = '„'+(d.job||'Auftrag')+'"';
      const tier = $('tier'); tier.textContent = d.tier||''; tier.className = 'tier '+(d.tier||'');
      const r = $('result'); const amt = Number(d.amount)||0;
      r.textContent = (amt>=0?'+':'−')+Math.abs(amt);
      r.className = 'result '+(win?'win':'lose');
      $('bal').innerHTML = `<small>Konto</small> ${Number(d.balance)||0}`;

      // tags
      const t = $('tags'); t.innerHTML='';
      if (d.jackpot) t.innerHTML += '<span class="tag jackpot">🎰 JACKPOT</span>';
      if (d.crit)    t.innerHTML += '<span class="tag crit">💥 VOLLTREFFER ×2</span>';
      if (d.ambush)  t.innerHTML += '<span class="tag ambush">🏴‍☠️ ÜBERFALL</span>';
      if (Number(d.streak)>=3) t.innerHTML += `<span class="tag streak">🔥 STREAK ${d.streak}</span>`;

      card.className = win?'show win':'show lose';

      // Frachtschiff fliegt durch die Quantum-Lane
      road.style.opacity='1';
      truck.textContent = win?'🚀':'🛸';
      truck.style.transition='none'; truck.style.left='-160px';
      requestAnimationFrame(()=>{
        truck.style.transition='left 2.6s cubic-bezier(.4,0,.5,1)';
        truck.style.left = '2120px';   // Stage-Breite (1920) + Rand
      });

      // FX at card center-top
      const cx = innerWidth/2, cy = innerHeight - 300;
      if (win){
        const coins = d.jackpot?80:(d.crit?55:32);
        spawn(cx, cy, coins, {sp:9, up:6, size:26, g:0.18, color:C.gold, text:'🪙'});
        spawn(cx, cy, 40, {sp:7, up:4, size:5, g:0.1, color:C.green});
        if (d.jackpot){ confetti(); }
      } else {
        card.classList.add('crash');
        spawn(cx, cy, 46, {sp:8, up:2, size:6, g:0.22, color:C.red});
        spawn(cx, cy, 16, {sp:5, up:1, size:30, g:0.15, color:C.red, text:'💥'});
        if (d.ambush) spawn(cx, cy, 10, {sp:6, up:3, size:30, g:0.12, color:C.red, text:'🏴‍☠️'});
      }

      const hold = d.jackpot?6500:5000;
      setTimeout(()=>{
        card.classList.remove('show','win','lose','crash');
        road.style.opacity='0';
        res();
      }, hold);
    });
  }

  function confetti(){
    const cols=[C.gold,C.cyan,C.green,C.ink,C.steel];
    for(let k=0;k<3;k++) setTimeout(()=>{
      for(let i=0;i<60;i++)
        spawn(Math.random()*innerWidth, -20, 1,
          {sp:3, up:-2, size:7, g:0.15, color:cols[i%cols.length]});
    }, k*250);
  }

  const esc = s => String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

  // ── WS ──
  function connect(){
    let ws;
    try { ws = new WebSocket(SB); } catch(e){ return setTimeout(connect,2000); }
    ws.onopen = () => ws.send(JSON.stringify({event:'cc_haul_register'}));
    ws.onmessage = e => {
      try {
        const m = JSON.parse(e.data);
        const d = m.type==='haul' ? m : (m.data && m.data.type==='haul' ? m.data : null);
        if (d) enqueue(d);
      } catch(x){}
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => {};
  }

  // ── Demo ──
  function demo(){
    const samples = [
      {type:'haul',user:'CargoKid',emoji:'💊',job:'Medical Supplies → New Babbage',tier:'LEICHT',success:true,amount:240,balance:1240,streak:2,badge:'🟡',rank:'Kurierfahrer'},
      {type:'haul',user:'QuantaQueen',emoji:'☢️',job:'Quantanium-Transport',tier:'SCHWER',success:false,amount:-540,balance:700,streak:0,ambush:true,badge:'🟢'},
      {type:'haul',user:'JumptownJoe',emoji:'🏭',job:'Jumptown Drug-Run',tier:'EXTREM',success:true,amount:5200,balance:30200,streak:5,crit:true,jackpot:true,badge:'🟣',rank:'Logistik-Magnat'},
      {type:'haul',user:'HullCHero',emoji:'🥇',job:'Gold-Konvoi → Grim HEX',tier:'MITTEL',success:true,amount:430,balance:4830,streak:4,crit:true,badge:'🟠'},
    ];
    let i=0;
    const fire=()=>{ enqueue(samples[i%samples.length]); i++; };
    fire(); setInterval(fire, 8000);
  }

  if (DEMO) demo(); else connect();
})();
</script>
</body>
</html>
