<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hauling Overlay</title>
<!--
  Hauling OBS-Overlay – grafische Untermalung des !haul Chatgames.
  Standalone: verbindet direkt zur Streamerbot-WS, sendet
  { event:'cc_haul_register' }, empfängt Spiel-Events (type:'haul')
  von Hauling.cs via cc_haul_session.

  OBS Browser-Source:  /alerts/haul.html        (live, transparent)
  Test im Browser:     /alerts/haul.html?demo=1 (feuert Beispiele)
  WS überschreiben:    ?sb=ws://host:port
-->
<style>
  :root{
    --green:#37e08a; --red:#ff5a6e; --gold:#ffd23f; --cyan:#46d3ff;
    --ink:#eaf4ff; --panel:rgba(10,16,28,.82); --line:rgba(90,170,255,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;
    font-family:'Segoe UI',Roboto,system-ui,sans-serif;color:var(--ink)}
  #fx{position:fixed;inset:0;z-index:1;pointer-events:none}

  /* ── Auftrags-Karte (Lower Third) ── */
  #card{
    position:fixed;left:50%;bottom:140px;transform:translate(-50%,160%);
    z-index:2;width:980px;min-height:150px;opacity:0;
    background:linear-gradient(135deg,rgba(14,22,38,.92),rgba(8,14,26,.92));
    border:1px solid var(--line);border-radius:18px;
    box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04) inset;
    padding:22px 30px;backdrop-filter:blur(4px);
    transition:transform .55s cubic-bezier(.16,1,.3,1),opacity .4s ease;
  }
  #card.show{transform:translate(-50%,0);opacity:1}
  #card.win{border-color:rgba(55,224,138,.6);box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 38px rgba(55,224,138,.28)}
  #card.lose{border-color:rgba(255,90,110,.6);box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 38px rgba(255,90,110,.28)}

  .top{display:flex;align-items:center;gap:16px}
  .jobEmoji{font-size:56px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
  .meta{flex:1;min-width:0}
  .user{font-size:30px;font-weight:800;letter-spacing:.3px;
    text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .user .badge{font-size:24px;margin-left:6px}
  .job{font-size:20px;color:#9db8d8;margin-top:2px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .tier{display:inline-block;font-size:13px;font-weight:700;letter-spacing:1px;
    padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:middle;
    border:1px solid currentColor}
  .tier.LEICHT{color:#7fe3a0} .tier.MITTEL{color:#ffd23f}
  .tier.SCHWER{color:#ff9a4d} .tier.EXTREM{color:#ff5a6e}

  .result{font-size:54px;font-weight:900;text-align:right;line-height:1;
    text-shadow:0 3px 14px rgba(0,0,0,.55);white-space:nowrap}
  .result.win{color:var(--green)} .result.lose{color:var(--red)}

  .bottom{display:flex;align-items:center;justify-content:space-between;
    margin-top:16px;padding-top:14px;border-top:1px solid rgba(120,170,240,.18);
    font-size:19px;color:#bcd2ee}
  .tags{display:flex;gap:10px}
  .tag{font-weight:800;padding:4px 12px;border-radius:999px;font-size:16px;
    letter-spacing:.5px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
  .tag.crit{background:rgba(255,210,63,.16);color:var(--gold);border:1px solid rgba(255,210,63,.5)}
  .tag.jackpot{background:rgba(255,210,63,.22);color:#fff;border:1px solid var(--gold);
    text-shadow:0 0 10px var(--gold)}
  .tag.ambush{background:rgba(255,90,110,.16);color:var(--red);border:1px solid rgba(255,90,110,.5)}
  .tag.streak{background:rgba(70,211,255,.14);color:var(--cyan);border:1px solid rgba(70,211,255,.45)}
  .bal{font-weight:800;color:#eaf4ff}
  .bal small{color:#8aa6c8;font-weight:600}

  /* ── Quantum-Lane + Frachtschiff ── */
  #road{position:fixed;left:0;right:0;bottom:120px;height:4px;z-index:2;opacity:0;
    background:linear-gradient(90deg,transparent,rgba(70,211,255,.7) 30%,rgba(70,211,255,.9) 50%,rgba(70,211,255,.7) 70%,transparent);
    box-shadow:0 0 24px 4px rgba(70,211,255,.5);transition:opacity .3s}
  #truck{position:fixed;bottom:104px;left:-180px;z-index:2;font-size:78px;
    filter:drop-shadow(0 0 16px rgba(70,211,255,.6))}

  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes shake{10%,90%{transform:translate(-51%,2px)}30%,70%{transform:translate(-49%,-3px)}
    50%{transform:translate(-50%,3px)}}
  #card.crash{animation:shake .5s linear}
</style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div id="road"></div>
  <div id="truck">🚀</div>

  <div id="card">
    <div class="top">
      <div class="jobEmoji" id="jobEmoji">📦</div>
      <div class="meta">
        <div class="user" id="user">Spieler <span class="badge" id="badge">⚪</span></div>
        <div class="job"><span id="jobName">Auftrag</span><span class="tier" id="tier">LEICHT</span></div>
      </div>
      <div class="result" id="result">+0</div>
    </div>
    <div class="bottom">
      <div class="tags" id="tags"></div>
      <div class="bal" id="bal"><small>Konto</small> 0</div>
    </div>
  </div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const SB = qs.get('sb') || 'ws://192.168.178.39:9090';
  const DEMO = qs.has('demo');

  const $ = id => document.getElementById(id);
  const card = $('card'), truck = $('truck'), road = $('road');

  // ── Canvas particles ──
  const cv = $('fx'), ctx = cv.getContext('2d');
  function resize(){ cv.width = innerWidth; cv.height = innerHeight; }
  resize(); addEventListener('resize', resize);

  let parts = [];
  function spawn(x, y, n, opts){
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, sp = opts.sp*(0.4+Math.random()*0.9);
      parts.push({
        x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - (opts.up||0),
        life: 1, decay: 0.008+Math.random()*0.014,
        size: opts.size*(0.6+Math.random()*0.8),
        g: opts.g==null?0.12:opts.g, color: opts.color,
        text: opts.text || null, rot: Math.random()*6, vr:(Math.random()-.5)*0.3
      });
    }
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for (let i=parts.length-1;i>=0;i--){
      const p = parts[i];
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.life -= p.decay; p.rot += p.vr;
      if (p.life<=0){ parts.splice(i,1); continue; }
      ctx.save(); ctx.globalAlpha = Math.max(0,p.life);
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      if (p.text){ ctx.font = `${p.size}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(p.text,0,0); }
      else { ctx.fillStyle = p.color; ctx.shadowColor=p.color; ctx.shadowBlur=12;
        ctx.beginPath(); ctx.arc(0,0,p.size,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    }
    requestAnimationFrame(tick);
  }
  tick();

  // ── Queue ──
  const queue = []; let busy = false;
  function enqueue(d){ queue.push(d); if(!busy) next(); }
  function next(){
    const d = queue.shift();
    if(!d){ busy=false; return; }
    busy = true; play(d).then(()=>setTimeout(next, 350));
  }

  const C = { green:'#37e08a', red:'#ff5a6e', gold:'#ffd23f', cyan:'#46d3ff' };

  function play(d){
    return new Promise(res => {
      const win = !!d.success;
      // fill card
      $('jobEmoji').textContent = d.emoji || (win?'📦':'💥');
      $('user').innerHTML = `${esc(d.user||'Spieler')} <span class="badge">${d.badge||'⚪'}</span>`;
      $('jobName').textContent = '„'+(d.job||'Auftrag')+'"';
      const tier = $('tier'); tier.textContent = d.tier||''; tier.className = 'tier '+(d.tier||'');
      const r = $('result'); const amt = Number(d.amount)||0;
      r.textContent = (amt>=0?'+':'−')+Math.abs(amt);
      r.className = 'result '+(win?'win':'lose');
      $('bal').innerHTML = `<small>Konto</small> ${Number(d.balance)||0}`;

      // tags
      const t = $('tags'); t.innerHTML='';
      if (d.jackpot) t.innerHTML += '<span class="tag jackpot">🎰 JACKPOT</span>';
      if (d.crit)    t.innerHTML += '<span class="tag crit">💥 VOLLTREFFER ×2</span>';
      if (d.ambush)  t.innerHTML += '<span class="tag ambush">🏴‍☠️ ÜBERFALL</span>';
      if (Number(d.streak)>=3) t.innerHTML += `<span class="tag streak">🔥 STREAK ${d.streak}</span>`;

      card.className = win?'show win':'show lose';

      // Frachtschiff fliegt durch die Quantum-Lane
      road.style.opacity='1';
      truck.textContent = win?'🚀':'🛸';
      truck.style.transition='none'; truck.style.left='-160px';
      requestAnimationFrame(()=>{
        truck.style.transition='left 2.6s cubic-bezier(.4,0,.5,1)';
        truck.style.left = (innerWidth+160)+'px';
      });

      // FX at card center-top
      const cx = innerWidth/2, cy = innerHeight - 300;
      if (win){
        const coins = d.jackpot?80:(d.crit?55:32);
        spawn(cx, cy, coins, {sp:9, up:6, size:26, g:0.18, color:C.gold, text:'🪙'});
        spawn(cx, cy, 40, {sp:7, up:4, size:5, g:0.1, color:C.green});
        if (d.jackpot){ confetti(); }
      } else {
        card.classList.add('crash');
        spawn(cx, cy, 46, {sp:8, up:2, size:6, g:0.22, color:C.red});
        spawn(cx, cy, 16, {sp:5, up:1, size:30, g:0.15, color:C.red, text:'💥'});
        if (d.ambush) spawn(cx, cy, 10, {sp:6, up:3, size:30, g:0.12, color:C.red, text:'🏴‍☠️'});
      }

      const hold = d.jackpot?6500:5000;
      setTimeout(()=>{
        card.classList.remove('show','win','lose','crash');
        road.style.opacity='0';
        res();
      }, hold);
    });
  }

  function confetti(){
    const cols=[C.gold,C.cyan,C.green,'#ff8ad4','#fff'];
    for(let k=0;k<3;k++) setTimeout(()=>{
      for(let i=0;i<60;i++)
        spawn(Math.random()*innerWidth, -20, 1,
          {sp:3, up:-2, size:7, g:0.15, color:cols[i%cols.length]});
    }, k*250);
  }

  const esc = s => String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

  // ── WS ──
  function connect(){
    let ws;
    try { ws = new WebSocket(SB); } catch(e){ return setTimeout(connect,2000); }
    ws.onopen = () => ws.send(JSON.stringify({event:'cc_haul_register'}));
    ws.onmessage = e => {
      try {
        const m = JSON.parse(e.data);
        const d = m.type==='haul' ? m : (m.data && m.data.type==='haul' ? m.data : null);
        if (d) enqueue(d);
      } catch(x){}
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => {};
  }

  // ── Demo ──
  function demo(){
    const samples = [
      {type:'haul',user:'CargoKid',emoji:'💊',job:'Medical Supplies → New Babbage',tier:'LEICHT',success:true,amount:240,balance:1240,streak:2,badge:'🟡',rank:'Kurierfahrer'},
      {type:'haul',user:'QuantaQueen',emoji:'☢️',job:'Quantanium-Transport',tier:'SCHWER',success:false,amount:-540,balance:700,streak:0,ambush:true,badge:'🟢'},
      {type:'haul',user:'JumptownJoe',emoji:'🏭',job:'Jumptown Drug-Run',tier:'EXTREM',success:true,amount:5200,balance:30200,streak:5,crit:true,jackpot:true,badge:'🟣',rank:'Logistik-Magnat'},
      {type:'haul',user:'HullCHero',emoji:'🥇',job:'Gold-Konvoi → Grim HEX',tier:'MITTEL',success:true,amount:430,balance:4830,streak:4,crit:true,badge:'🟠'},
    ];
    let i=0;
    const fire=()=>{ enqueue(samples[i%samples.length]); i++; };
    fire(); setInterval(fire, 8000);
  }

  if (DEMO) demo(); else connect();
})();
</script>
</body>
</html>
