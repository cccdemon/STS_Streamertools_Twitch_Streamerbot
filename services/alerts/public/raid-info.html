<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>RDOC – Raid Info</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="rdoc-brand.css">
<style>
  /* ────────────────────────────────────────────────────────────
     RDOC – Raid info panel

     Brand layer: rdoc-brand.css, linked above; data-theme="dark"
     on <html> keeps an OBS light preference from flipping tokens.
     Palette literals (rgba() cannot take a variable): Space
     #121416, Graphite #2B3135, Off White #F2F2F0, Steel #76828D,
     Copper #C48A4A, Patina #4FB5B5.

     Copper labels the event, Patina carries frame and structure.
     No gradient, glow or text-shadow. Eyebrow labels run at 0.3em
     tracking - read across a room, not in a browser tab.
     ──────────────────────────────────────────────────────────── */

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: var(--rdoc-font-text);
  }

  /* ── MAIN PANEL ── right side, vertical strip */
  #raid-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 560px;
    height: 1080px;
    background: rgba(18,20,22,0.95);
    border-left: 1.5px solid rgba(79,181,181,0.45);
    pointer-events: none;
    opacity: 0;
    transform: translateX(40px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
    gap: 0;
  }

  #raid-panel.active {
    opacity: 1;
    transform: translateX(0);
  }

  /* Copper corner brackets */
  #raid-panel::before, #raid-panel::after {
    content: ''; position: absolute;
    width: 40px; height: 40px;
    border-color: #C48A4A; border-style: solid;
  }
  #raid-panel::before { top:-2px; left:-2px; border-width:3px 0 0 3px; }
  #raid-panel::after  { bottom:-2px; left:-2px; border-width:0 0 3px 3px; }

  .panel-corner-tr {
    position: absolute; top:-2px; right:-2px;
    width:40px; height:40px;
    border:3px solid #C48A4A; border-width:3px 3px 0 0;
  }
  .panel-corner-br {
    position: absolute; bottom:-2px; right:-2px;
    width:40px; height:40px;
    border:3px solid #C48A4A; border-width:0 3px 3px 0;
  }

  /* Flat hairlines - the old ones were four-stop gradients. */
  .panel-top-line {
    position: absolute; top:0; left:40px; right:40px; height:1px;
    background: #C48A4A; opacity: 0.6;
  }
  .panel-bottom-line {
    position: absolute; bottom:0; left:40px; right:40px; height:1px;
    background: #4FB5B5; opacity: 0.45;
  }

  /* Side bar: flat Patina, pulsing opacity only. */
  .panel-bar {
    position: absolute; top:60px; bottom:60px; left:-10px; width:2px;
    background: #4FB5B5;
    animation: barPulse 3s ease-in-out infinite;
  }
  @keyframes barPulse {
    0%,100% { opacity:0.4; } 50% { opacity:1.0; }
  }

  /* Scanline texture removed - repeating gradient. */
  .panel-scan { display:none; }

  /* ── LABEL ── */
  .raid-label {
    font-family: var(--rdoc-font-mono);
    font-size: 12px;
    letter-spacing: 0.3em;
    color: #C48A4A;
    text-transform: uppercase;
    margin-bottom: 36px;
  }

  /* ── AVATAR ── */
  .raid-avatar-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 32px;
  }
  .raid-avatar-wrap::before, .raid-avatar-wrap::after {
    content: ''; position: absolute;
    width: 18px; height: 18px;
    border-color: #C48A4A; border-style: solid;
  }
  .raid-avatar-wrap::before { top:-3px; left:-3px; border-width:3px 0 0 3px; }
  .raid-avatar-wrap::after  { bottom:-3px; right:-3px; border-width:0 3px 3px 0; }

  #raidAvatar {
    width: 180px;
    height: 180px;
    border: 2px solid #4FB5B5;
    display: block;
    object-fit: cover;
  }

  /* ── NAME ── */
  /* Michroma: one cut, tracking 0, ~1.35x wider than the old
     Orbitron 900 - hence 30px instead of 38px. */
  #raidName {
    font-family: var(--rdoc-font-display);
    font-size: 30px;
    color: #F2F2F0;
    letter-spacing: 0;
    text-align: center;
    line-height: 1.15;
    margin-bottom: 10px;
    word-break: break-word;
  }

  /* ── VIEWER BADGE ── */
  #raidViewers {
    font-family: var(--rdoc-font-mono);
    font-size: 14px;
    letter-spacing: 0.2em;
    color: #C48A4A;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  /* ── DIVIDER ── */
  .panel-divider {
    width: 100%;
    height: 1px;
    background: #2B3135;
    margin-bottom: 28px;
  }

  /* ── GAME TAG ── */
  .info-row {
    width: 100%;
    margin-bottom: 16px;
  }
  .info-key {
    font-family: var(--rdoc-font-mono);
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #4FB5B5;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .info-val {
    font-family: var(--rdoc-font-mono);
    font-size: 15px;
    letter-spacing: 0.02em;
    color: #F2F2F0;
    line-height: 1.5;
  }
  .info-val .hl { color: #C48A4A; }

  /* ── AI SUMMARY ── */
  /* A paragraph, so Plex Sans and not uppercased. */
  #raidSummary {
    font-family: var(--rdoc-font-text);
    font-size: 19px;
    color: #F2F2F0;
    line-height: 1.6;
    text-align: left;
    width: 100%;
    margin-top: 4px;
    word-break: break-word;
    white-space: pre-wrap;
  }

  /* Loading dots */
  #loadingDots {
    font-family: var(--rdoc-font-mono);
    font-size: 14px;
    letter-spacing: 0.2em;
    color: #4FB5B5;
    text-align: center;
    width: 100%;
    margin-top: 4px;
    display: none;
  }
  #loadingDots.visible { display: block; }

  /* ── TWITCH URL ── */
  #raidUrl {
    font-family: var(--rdoc-font-mono);
    font-size: 13px;
    letter-spacing: 0.2em;
    color: #76828D;
    text-transform: lowercase;
    margin-top: 28px;
    text-align: center;
  }

  /* ── DEBUG ── */
  #dbg {
    position: fixed;
    bottom: 12px;
    left: 12px;
    font-family: var(--rdoc-font-mono);
    font-size: 11px;
    color: #76828D;
    letter-spacing: 0.07em;
    pointer-events: none;
    z-index: 9999;
    max-width: 400px;
  }
</style>
</head>
<body>

<!-- ── RAID INFO PANEL ── -->
<div id="raid-panel">
  <div class="panel-corner-tr"></div>
  <div class="panel-corner-br"></div>
  <div class="panel-top-line"></div>
  <div class="panel-bottom-line"></div>
  <div class="panel-bar"></div>
  <div class="panel-scan"></div>

  <div class="raid-label">// Incoming Raid</div>

  <div class="raid-avatar-wrap">
    <img id="raidAvatar" src="" alt="">
  </div>

  <div id="raidName">—</div>
  <div id="raidViewers"></div>

  <div class="panel-divider"></div>

  <div class="info-row" id="gameRow">
    <div class="info-key">// Letztes Spiel</div>
    <div class="info-val" id="raidGame">—</div>
  </div>

  <div class="panel-divider"></div>

  <div class="info-row">
    <div class="info-key">// Crew-Analyse</div>
    <div id="loadingDots">// analysiere signale ...</div>
    <div id="raidSummary"></div>
  </div>

  <div id="raidUrl"></div>
</div>

<!-- Debug -->
<div id="dbg"></div>

<script>
// ─────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────
const params  = new URLSearchParams(location.search);


const panel      = document.getElementById('raid-panel');
const elName     = document.getElementById('raidName');
const elViewers  = document.getElementById('raidViewers');
const elAvatar   = document.getElementById('raidAvatar');
const elGame     = document.getElementById('raidGame');
const elSummary  = document.getElementById('raidSummary');
const elLoading  = document.getElementById('loadingDots');
const elUrl      = document.getElementById('raidUrl');
const elDbg      = document.getElementById('dbg');

let hideTimer    = null;
let typeTimer    = null;

// ─────────────────────────────────────────────
// DEBUG
// ─────────────────────────────────────────────
function dbg(msg) {
  elDbg.textContent = '// ' + msg;
  console.log('[RaidInfo]', msg);
}

// ─────────────────────────────────────────────
// WEBSOCKET
// ─────────────────────────────────────────────
let ws, reconnectDelay = 1000;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  dbg(`WS → ${proto}//${location.host}/alerts/ws`);
  ws = new WebSocket(`${proto}//${location.host}/alerts/ws`);

  ws.onopen = () => {
    reconnectDelay = 1000;
    dbg('WS verbunden ✓');
    ws.send(JSON.stringify({ event: 'cc_identify', role: 'raid-overlay' }));
  };

  ws.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      // API broadcast format: { event: 'raid', user: '...' }
      if (d.event === 'raid') handleRaid(d);
      // Direct format (Streamerbot custom server)
      if (d.alertType === 'raid') handleRaid(d);
    } catch(_) {}
  };

  ws.onclose = () => {
    dbg(`WS getrennt – reconnect in ${reconnectDelay/1000}s`);
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 10000);
  };

  ws.onerror = () => ws.close();
}

// ─────────────────────────────────────────────
// TWITCH USER LOOKUP
// ─────────────────────────────────────────────
async function fetchTwitchUser(login) {
  const res = await fetch(`/alerts/api/twitch/user/${encodeURIComponent(login)}`);
  if (!res.ok) throw new Error(`API HTTP ${res.status}`);
  return await res.json();
}

// ─────────────────────────────────────────────
// HANDLE RAID
// ─────────────────────────────────────────────
async function handleRaid(data) {
  const user    = data.user    || 'Unbekannt';
  const viewers = data.amount  || '0';
  let   avatar  = data.profileImageUrl || '';
  const game    = data.game    || '';
  let   bio     = data.bio     || '';

  dbg(`Raid von ${user} mit ${viewers} Viewern`);

  // Reset
  clearTimeout(hideTimer);
  clearTimeout(typeTimer);
  elSummary.textContent = '';
  elLoading.classList.remove('visible');

  // Populate
  elName.textContent    = user;
  elViewers.textContent = `// ${viewers} viewer inbound`;
  elGame.textContent    = game || '—';
  elUrl.textContent     = `twitch.tv/${user.toLowerCase()}`;

  // Avatar mit Default vorab setzen
  elAvatar.src = avatar || 'https://static-cdn.jtvnw.net/user-default-pictures-uv/ebe4cd89-b4f4-4cd9-adac-2f30151b4209-profile_image-300x300.png';
  elAvatar.style.display = 'block';

  // Panel sofort zeigen – Netzwerk-Fetches dürfen das Einblenden nicht blockieren
  panel.classList.add('active');
  elLoading.classList.add('visible');

  // Twitch-Fallback für Avatar und Bio
  if (!avatar || !bio) {
    try {
      const tw = await fetchTwitchUser(user.toLowerCase());
      if (!avatar && tw.profile_image_url) { avatar = tw.profile_image_url; elAvatar.src = avatar; }
      if (!bio    && tw.description)       { bio    = tw.description; }
      dbg(avatar ? 'Twitch User ✓' : 'Twitch User leer');
    } catch (err) {
      dbg(`Twitch User Fehler: ${err.message}`);
    }
  }

  // Fetch AI summary
  const summary = await fetchSummary(user, game, bio);
  elLoading.classList.remove('visible');

  // Text direkt anzeigen – kein Typewriter
  elSummary.textContent = summary;

  // Auto-hide after 30s
  hideTimer = setTimeout(() => {
    panel.classList.remove('active');
  }, 15000);
}

// ─────────────────────────────────────────────
// TYPEWRITER
// ─────────────────────────────────────────────
function typeWriter(text, el, delay = 30) {
  el.textContent = '';
  let i = 0;
  function next() {
    if (i < text.length) {
      el.textContent += text[i++];
      typeTimer = setTimeout(next, delay);
    }
  }
  next();
}

// ─────────────────────────────────────────────
// CLAUDE API – SUMMARY
// ─────────────────────────────────────────────
async function fetchSummary(user, game, bio) {
  try {
    const res = await fetch('/alerts/api/claude/summary', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'raid', user, game, bio }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    dbg('Claude ✓');
    return json.summary || buildFallback(user, game, bio);
  } catch (err) {
    dbg(`Claude Fehler: ${err.message}`);
    return buildFallback(user, game, bio);
  }
}

// ─────────────────────────────────────────────
// FALLBACK (ohne API-Key)
// ─────────────────────────────────────────────
function buildFallback(user, game, bio) {
  const gameStr = game ? `Zuletzt aktiv in ${game}. ` : '';
  const bioStr  = bio  ? `"${bio.slice(0, 100)}" ` : '';
  return `${gameStr}${bioStr}Einlass gewährt für ${user}.`;
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
connect();

// Test direkt im Browser (kein WS nötig)
const testParam = params.get('test');
if (testParam === 'raid' && !params.get('host')) {
  setTimeout(() => handleRaid({
    user:            params.get('user')   || 'SerenityPilot',
    amount:          params.get('amount') || '77',
    profileImageUrl: '',
    game:            params.get('game')   || 'Star Citizen',
    bio:             'Raumfahrer und Geschichtenerzähler. Jeden Abend im Vers unterwegs.',
  }), 500);
}
</script>
</body>
</html>
