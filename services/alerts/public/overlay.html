<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDOC – Alert Overlay</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="rdoc-brand.css">
<style>
  /* ────────────────────────────────────────────────────────────
     RDOC – Alert overlay (the single alert renderer)

     Brand layer: rdoc-brand.css above. data-theme="dark" stops an
     OBS source reporting prefers-color-scheme: light from flipping
     the tokens mid-stream.

     How colour is spent on ONE alert
     ---------------------------------
     Copper appears exactly twice and never more: on the SIGNET and
     on the EVENT LABEL. The kit allows both ("Copper ist fuer
     Buttons, Akzentlinien, das Signet, aktive Zustaende und
     einzelne Labels") and allows nothing else.
       - Signet       Copper, static, once per view, min 32px
       - Event label  Copper, or the functional colour when the
                      event IS a state (raid = Error, hype = Success)
       - Frame, corner ticks, rules, stat box, avatar edge
                      Patina. Structure is never the accent.
       - Username, message, stat number
                      Off White. The primary foreground is not an
                      accent, and a name is body voice.
       - Stat label, secondary lines
                      Steel.
     The username used to change colour per event type, which put a
     third and a fourth accent on screen and made the event legible
     only to someone who had learnt the colour code. The event is
     now named in words, which is also the accessibility rule.

     Type
     ----
     Michroma has ONE cut (400) at tracking 0. Every font-weight
     600/900 on a display element is gone; emphasis is size and
     colour. Prose is Plex Sans, technical labels are Plex Mono at
     the overlay eyebrow tracking of 0.3em - read across a room at
     1920px, the one intentional type deviation in the stack.

     No effect
     ---------
     No gradient, glow, shadow, bevel, metal. That now includes the
     four avatar drop-shadow halos, the Latest widget text-shadow,
     the canvas shadowBlur on every particle and hull, and the
     radial haze behind the raid fleet. hue-rotate is gone from the
     glitch keyframe too: it dragged Copper and Patina off-palette
     for a few frames, which is exactly what the palette forbids.

     Motion filters (blur/brightness inside keyframes) are kept:
     they are transition mechanics, not a surface treatment, and
     they are disabled under prefers-reduced-motion at the bottom
     of this block.

     Colour literals are written out because most of this page's
     styling is inline strings in the JS below, and rgba() cannot
     take a CSS variable. Values come from the kit's tokens.js:
       Space #121416  Graphite #2B3135  Off White #F2F2F0
       Steel #76828D  Copper #C48A4A    Patina  #4FB5B5
       Success #63C271 Warning #EBCF52  Error #EE6E76
     ──────────────────────────────────────────────────────────── */
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  /* 1080p-Layout per transform:scale auf 1440p (2560×1440) skaliert (#cc-ov).
     OBS Browser-Source-Größe = 2560 × 1440 setzen. */
  html, body { width:2560px; height:1440px; background:transparent; overflow:hidden; }

  /* ── Keyframes ───────────────────────────────────── */
  @keyframes ccAlertIn {
    0%   { opacity:0; transform:translateY(54px) scaleX(0.92); filter:blur(5px) brightness(1.7); }
    55%  { opacity:1; transform:translateY(-7px) scaleX(1.008); filter:blur(0) brightness(1.04); }
    74%  { transform:translateY(3px) scaleX(0.998); }
    88%  { transform:translateY(-2px) scaleX(1.002); }
    100% { opacity:1; transform:translateY(0) scaleX(1); filter:none; }
  }
  @keyframes ccAlertOut {
    0%   { opacity:1; transform:translateY(0) scaleX(1); }
    28%  { opacity:1; transform:translateY(-9px) scaleX(1.008); }
    100% { opacity:0; transform:translateY(38px) scaleX(0.93); filter:blur(3px) brightness(1.6); }
  }
  /* Displacement only. hue-rotate used to swing Copper and Patina
     off the palette for a few frames. */
  @keyframes ccGlitch {
    0%   { transform:translateX(0); filter:none; }
    8%   { transform:translateX(-7px); filter:brightness(1.7); }
    14%  { transform:translateX(9px);  filter:brightness(1.4); }
    20%  { transform:translateX(-4px); filter:brightness(1.2); }
    26%  { transform:translateX(3px);  filter:none; }
    32%  { transform:translateX(0);    filter:none; }
    100% { transform:translateX(0);    filter:none; }
  }
  @keyframes ccDecrypt {
    0%   { filter:blur(14px) brightness(2.2) contrast(0.35) saturate(0.4); transform:scale(0.9); }
    30%  { filter:blur(7px) brightness(1.5) contrast(0.65) saturate(0.75); transform:scale(0.95); }
    62%  { filter:blur(2.5px) brightness(1.15) contrast(0.9); transform:scale(1.005); }
    100% { filter:none; transform:scale(1); }
  }
  /* Frame emphasis is a border pulse. It used to be a box-shadow
     bloom, which the brand rules out. */
  @keyframes ccBorderCyan {
    0%,100% { border-color:rgba(79,181,181,0.45); }
    50%     { border-color:rgba(79,181,181,1); }
  }
  @keyframes ccBorderRaid {
    0%,100% { border-color:rgba(238,110,118,0.5); }
    50%     { border-color:rgba(238,110,118,1); }
  }
  /* There is no Copper frame. A border is structure, and Copper is
     already spent on the signet and the event label; a third one
     would break the one-accent rule. 'gold' survives as a class
     name because buildAlert() writes it, but it pulses Patina. */
  @keyframes ccBorderGold {
    0%,100% { border-color:rgba(79,181,181,0.45); }
    50%     { border-color:rgba(79,181,181,1); }
  }
  @keyframes ccBorderGreen {
    0%,100% { border-color:rgba(99,194,113,0.5); }
    50%     { border-color:rgba(99,194,113,1); }
  }
  @keyframes ccHypeShake {
    0%,100% { transform:translate(0,0) rotate(0); }
    20%     { transform:translate(-2px,-2px) rotate(-0.25deg); }
    40%     { transform:translate(2px,2px) rotate(0.3deg); }
    60%     { transform:translate(-2px,1px) rotate(-0.18deg); }
    80%     { transform:translate(2px,-1px) rotate(0.1deg); }
  }
  @keyframes ccSoPanelIn {
    0%   { transform:translateX(102%); }
    58%  { transform:translateX(-13px); }
    80%  { transform:translateX(7px); }
    100% { transform:translateX(0); }
  }
  /* Shoutout exit, two beats.
     Beat 1: the centre text tucks to the right, toward the panel.
     Beat 2: text and panel leave the frame to the right together, so
     they read as one object being pulled off rather than two elements
     that happen to end at the same time. The panel keyframe therefore
     has no anticipation bounce any more - a 9px kick on one of two
     things moving in lockstep is what broke the pairing. */
  @keyframes ccSoTextTuck {
    0%   { transform:translateX(0); }
    100% { transform:translateX(420px); }
  }
  /* The text has to CLEAR the 1920px stage, not fade out while standing
     on it. The block is centred in the 1320px left area, so its left
     edge sits around x=400 at the widest; +1900px puts it past 2300 and
     the frame ends at 1920. The old 1180px left roughly a third of the
     text on screen when opacity reached 0, which is why it read as a
     dissolve rather than an exit. Opacity now only closes over the last
     15%, as a tail so nothing lingers for a frame - the travel does the
     work. */
  @keyframes ccSoTextOut {
    0%   { transform:translateX(420px);  opacity:1; }
    85%  { opacity:1; }
    100% { transform:translateX(1900px); opacity:0; }
  }
  /* 104% of the panel's own 600px is 624px, so its left edge goes from
     1320 to 1944 and clears 1920 on translation alone. It no longer
     dissolves on the way out either: a panel that fades while it is
     still moving reads as two exits happening at once. */
  @keyframes ccSoPanelOut {
    0%   { transform:translateX(0); opacity:1; }
    85%  { opacity:1; }
    100% { transform:translateX(104%); opacity:0; }
  }
  @keyframes ccSoRing   { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  @keyframes ccEnergy   { 0% { transform:translateY(-100%); } 50% { transform:translateY(100%); } 100% { transform:translateY(-100%); } }
  @keyframes ccBlink    { 0%,100% { opacity:1; } 50% { opacity:0; } }
  @keyframes ccRiseFade { 0% { opacity:0; transform:translateY(8px); } 100% { opacity:1; transform:translateY(0); } }
  @keyframes ccLetterIn {
    0%   { opacity:0; transform:translate(var(--lx,0),var(--ly,18px)) rotate(var(--lr,0)) scale(1.5); filter:blur(3px); }
    55%  { opacity:1; filter:blur(0); }
    100% { opacity:1; transform:translate(0,0) rotate(0) scale(1); filter:blur(0); }
  }
  @keyframes ccAlertSlam {
    0%   { opacity:0; transform:translateY(-70px) scaleY(1.15) scaleX(0.96); filter:blur(4px) brightness(1.6); }
    45%  { opacity:1; transform:translateY(8px) scaleY(0.94) scaleX(1.03); filter:none; }
    65%  { transform:translateY(-4px) scaleY(1.02) scaleX(0.99); }
    100% { opacity:1; transform:translateY(0) scale(1); filter:none; }
  }
  @keyframes ccAlertPop {
    0%   { opacity:0; transform:scale(0.3) rotate(-3deg); filter:brightness(1.8); }
    55%  { opacity:1; transform:scale(1.06) rotate(0.6deg); filter:none; }
    75%  { transform:scale(0.98) rotate(-0.3deg); }
    100% { opacity:1; transform:scale(1) rotate(0); filter:none; }
  }
  @keyframes ccCompactIn {
    0%   { opacity:0; transform:translateX(60px) scaleX(0.9); filter:blur(3px); }
    60%  { opacity:1; transform:translateX(-6px) scaleX(1.01); filter:none; }
    100% { opacity:1; transform:translateX(0) scaleX(1); }
  }
  @keyframes ccCompactOut {
    0%   { opacity:1; transform:translateX(0); }
    100% { opacity:0; transform:translateX(70px); }
  }
  @keyframes ccLatestIn  { 0% { opacity:0; transform:translateY(10px); } 100% { opacity:1; transform:translateY(0); } }
  @keyframes ccLatestOut { 0% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(-10px); } }
  @keyframes ccScanSweep { 0% { transform:translateY(-100%); } 100% { transform:translateY(300%); } }

  /* ── Animation utility classes ───────────────────── */
  .cc-decrypt { animation:ccDecrypt 0.85s ease-out forwards; }
  .cc-glitch  { animation:ccGlitch 0.55s ease-out forwards; }

  .cc-frame-cyan  { animation:ccBorderCyan 2.4s ease-in-out infinite; }
  .cc-frame-raid  { border-color:rgba(238,110,118,0.5) !important; animation:ccBorderRaid 0.75s ease-in-out infinite; }
  .cc-frame-gold  { border-color:rgba(79,181,181,0.45) !important; animation:ccBorderGold 1.3s ease-in-out infinite; }
  .cc-frame-green { border-color:rgba(99,194,113,0.5) !important; animation:ccBorderGreen 1.3s ease-in-out infinite; }

  .cc-anim-hype { animation:ccHypeShake 0.28s ease-in-out infinite; }

  /* Corner ticks draw in via width/height. Structure, so Patina -
     they were Copper on all four corners, which spent the one
     accent four times on a single panel. */
  .cc-corner { position:absolute; width:0; height:0; border-color:#4FB5B5; border-style:solid; transition:width 0.2s ease-out, height 0.2s ease-out; }
  .cc-corner.drawn { width:26px; height:26px; }
  .cc-corner-tl { top:-2px; left:-2px; border-width:2.5px 0 0 2.5px; }
  .cc-corner-tr { top:-2px; right:-2px; border-width:2.5px 2.5px 0 0; }
  .cc-corner-bl { bottom:-2px; left:-2px; border-width:0 0 2.5px 2.5px; }
  .cc-corner-br { bottom:-2px; right:-2px; border-width:0 2.5px 2.5px 0; }

  /* Hairlines extend via scaleX. Flat colour - they were four-stop
     gradients. Both are structure, so both are Patina. */
  .cc-line { position:absolute; height:1px; transform:scaleX(0); transform-origin:center; transition:transform 0.3s ease-out, opacity 0.1s; opacity:0; }
  .cc-line.drawn { transform:scaleX(1); opacity:1; }
  .cc-line-top { top:0; left:40px; right:40px; background:#4FB5B5; }
  .cc-line-bot { bottom:0; left:40px; right:40px; background:#4FB5B5; }

  /* The signet.
     The dock ring appears exactly ONCE per view and is the only
     place besides the event label that carries Copper. Verbatim
     copy of the kit's digital/icon/rdoc_signet_copper.svg with
     fill switched to currentColor - re-copy it from the kit, never
     retype the coordinates. Standard cut, so never below 32px, and
     never animated: animating the mark is a brand violation, which
     is why the rotating diamond it replaces is gone. */
  .cc-signet { display:block; width:38px; height:38px; flex-shrink:0; color:#C48A4A; }
  .cc-signet svg { display:block; width:100%; height:100%; }

  /* Eyebrow.
     Plex Mono, versal, 0.3em - the overlay tracking, not the token
     0.07em. Ad-hoc px tracking (4px / 7px / 10px / 11px) does not
     scale with the font size and was different on every panel. */
  .cc-eyebrow { font-family:var(--rdoc-font-mono); font-size:12px; line-height:1.3; letter-spacing:0.3em; text-transform:uppercase; }

  /* Emphasis inside an alert sentence. Plex Sans Semibold is a real
     file and IS the way the kit emphasises body copy; the old H()
     helper wrapped the highlight in Copper, and body copy is never
     Copper. */
  .cc-em { font-weight:600; }

  .cc-demo-btn {
    font-family:var(--rdoc-font-mono); font-size:11px; letter-spacing:0.07em;
    text-transform:uppercase; background:transparent; border:1px solid rgba(79,181,181,0.5);
    color:#4FB5B5; padding:6px 10px; cursor:pointer; transition:background 0.12s; text-align:left;
  }
  .cc-demo-btn:hover { background:rgba(79,181,181,0.12); }
  .cc-demo-btn.gold  { border-color:rgba(196,138,74,0.55); color:#C48A4A; }
  .cc-demo-btn.gold:hover { background:rgba(196,138,74,0.14); }
  .cc-demo-btn.red   { border-color:rgba(238,110,118,0.5); color:#EE6E76; }
  .cc-demo-btn.red:hover { background:rgba(238,110,118,0.12); }
  .cc-demo-btn.green { border-color:rgba(99,194,113,0.5); color:#63C271; }
  .cc-demo-btn.green:hover { background:rgba(99,194,113,0.12); }

  /* Motion is a preference, not a decision the overlay makes. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<div id="cc-ov" style="position:relative; width:1920px; height:1080px; overflow:hidden; font-family:var(--rdoc-font-mono); transform:scale(1.3333); transform-origin:top left;">

  <!-- Demo backdrop (only visible in demo mode; transparent in OBS) -->
  <div id="cc-demo-bg" style="position:absolute; inset:0; z-index:0; display:none; background:#2B3135;">
    <!-- grid texture removed: repeating gradient -->
    <div class="cc-eyebrow" style="position:absolute; bottom:40px; left:50%; transform:translateX(-50%); font-size:11px; color:#76828D;">OBS Browser Source — Vorschau mit Hintergrund (live transparent)</div>
  </div>

  <!-- Canvas particle layer -->
  <canvas id="cc-canvas" width="1920" height="1080" style="position:absolute; inset:0; z-index:140; pointer-events:none;"></canvas>

  <!-- Screen flash -->
  <div id="cc-flash" style="position:absolute; inset:0; background:transparent; pointer-events:none; z-index:100; transition:background 0.08s;"></div>

  <!-- ──── ALERT ──── -->
  <div id="cc-alert" style="position:absolute; bottom:84px; left:50%; transform:translateX(-50%); pointer-events:none; z-index:150; width:920px;">
    <div id="cc-alert-anim" style="position:relative; opacity:0;">
      <div id="cc-frame" style="position:relative; background:rgba(18,20,22,0.88); border:1.5px solid rgba(79,181,181,0.45); padding:28px 40px 24px;">
        <div class="cc-corner cc-corner-tl" id="cc-ctl"></div>
        <div class="cc-corner cc-corner-tr" id="cc-ctr"></div>
        <div class="cc-corner cc-corner-bl" id="cc-cbl"></div>
        <div class="cc-corner cc-corner-br" id="cc-cbr"></div>
        <div class="cc-line cc-line-top" id="cc-ltop"></div>
        <div class="cc-line cc-line-bot" id="cc-lbot"></div>
        <!-- scanline texture removed: repeating gradient -->

        <div style="position:relative; z-index:10; display:flex; align-items:center; gap:28px;">
          <div id="cc-avwrap" style="display:none; flex-shrink:0; position:relative;">
            <img id="cc-avimg" alt="" style="display:block; width:96px; height:96px; object-fit:cover; border:1.5px solid #4FB5B5;">
            <div style="position:absolute; top:-2px; left:-2px; width:14px; height:14px; border-top:2px solid #4FB5B5; border-left:2px solid #4FB5B5;"></div>
            <div style="position:absolute; bottom:-2px; right:-2px; width:14px; height:14px; border-bottom:2px solid #4FB5B5; border-right:2px solid #4FB5B5;"></div>
          </div>

          <div style="flex:1; min-width:0; overflow:hidden;">
            <!-- The one signet of this view, and the event label:
                 the only two Copper elements on an alert. -->
            <div id="cc-lblrow" class="cc-eyebrow" style="color:#C48A4A; margin-bottom:10px; display:flex; align-items:center; gap:14px;">
              <span id="cc-diamond" class="cc-signet" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="RDOC"><title>RDOC</title><g transform="translate(-60 -60) scale(0.3125)"><path fill="currentColor" d="M523.168,192.195 A320 320 0 0 1 784.845,344.8 L682.528,407.5 A200 200 0 0 0 518.98,312.122 Z M795.843,364.24 A320 320 0 0 1 799.614,652.279 L691.759,599.674 A200 200 0 0 0 689.402,419.65 Z M789.128,672 A320 320 0 0 1 657.277,797.122 L602.798,690.201 A200 200 0 0 0 685.205,612 Z M444.124,680 L579.876,680 L631.874,808.699 A320 320 0 0 1 586.703,823.158 L575.497,776.485 A272 272 0 0 0 589.252,772.799 L573.612,720 L450.388,720 L434.748,772.799 A272 272 0 0 0 448.503,776.485 L437.297,823.158 A320 320 0 0 1 392.126,808.699 Z M366.723,797.122 A320 320 0 0 1 234.872,672 L338.795,612 A200 200 0 0 0 421.202,690.201 Z M224.386,652.279 A320 320 0 0 1 228.157,364.24 L334.598,419.65 A200 200 0 0 0 332.241,599.674 Z M239.155,344.8 A320 320 0 0 1 500.832,192.195 L505.02,312.122 A200 200 0 0 0 341.472,407.5 Z"/></g></svg></span>
              <span id="cc-lbl"></span>
            </div>
            <div id="cc-user" style="font-family:var(--rdoc-font-display); font-size:42px; letter-spacing:0; color:#F2F2F0; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
            <!-- A sentence, so Plex Sans and sentence case. Versal is
                 for short metadata only; a screen reader spells a long
                 versal run out letter by letter. -->
            <div id="cc-msg" style="font-family:var(--rdoc-font-text); font-size:19px; letter-spacing:0; color:#F2F2F0; margin-top:11px; line-height:1.6;"></div>
          </div>

          <div id="cc-stat" style="display:none; flex-shrink:0; border:1.5px solid #4FB5B5; padding:11px 20px; text-align:center; opacity:0; transform:translateX(22px); transition:opacity 0.3s, transform 0.3s;">
            <div id="cc-stat-num" style="font-family:var(--rdoc-font-display); font-size:30px; font-weight:400; letter-spacing:0; color:#F2F2F0; line-height:1;"></div>
            <div id="cc-stat-lbl" class="cc-eyebrow" style="font-size:10px; color:#76828D; margin-top:6px;"></div>
          </div>
        </div>
      </div>
      <!-- cc-glow kept for the script, never painted: glow is out -->
      <div id="cc-glow" style="display:none;"></div>
    </div>
  </div>

  <!-- ──── SHOUTOUT (cinematic split) ──── -->
  <div id="cc-so" style="position:absolute; inset:0; z-index:200; pointer-events:none; opacity:0;">
    <div id="cc-so-bg" style="position:absolute; inset:0; background:rgba(18,20,22,0); transition:background 0.5s ease;"></div>
    <div id="cc-so-beam" style="position:absolute; top:0; bottom:0; right:101%; width:4px; background:#2B3135; opacity:0; pointer-events:none;"></div>

    <!-- left: ambient stage.
         The clip used to sit on this container, which meant the centre
         text was cut off at the panel edge and could never travel with
         the panel on the way out. The ambient word is the only thing
         that actually needs clipping - it is 210px and set nowrap - so
         it gets its own clipped layer and the stage lets the text
         through. -->
    <div style="position:absolute; left:0; top:0; bottom:0; right:600px; display:flex; align-items:center; justify-content:center; padding:80px 70px;">
      <div style="position:absolute; inset:0; overflow:hidden; pointer-events:none;">
        <div id="cc-so-ambient" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-10deg); font-family:var(--rdoc-font-display); font-size:210px; color:rgba(79,181,181,0.035); letter-spacing:16px; text-transform:uppercase; white-space:nowrap; user-select:none;"></div>
      </div>
      <div id="cc-so-text" style="position:relative; text-align:center;">
        <div id="cc-so-hdr" class="cc-eyebrow" style="font-size:11px; color:#4FB5B5; margin-bottom:30px; opacity:0; transition:opacity 0.45s;">RDOC // SHOUTOUT</div>
        <div style="font-family:var(--rdoc-font-display); font-size:86px; color:#F2F2F0; letter-spacing:0; line-height:1.1;">SCHAUT<br>VORBEI</div>
        <div id="cc-so-bigname" style="font-family:var(--rdoc-font-display); font-size:40px; font-weight:400; color:#F2F2F0; letter-spacing:0; line-height:1.15; margin-top:22px; opacity:0; transition:opacity 0.45s;"></div>
        <div id="cc-so-bigurl" class="cc-eyebrow" style="font-size:14px; color:#76828D; margin-top:18px; opacity:0; transition:opacity 0.45s;"></div>
      </div>
    </div>

    <!-- right: detail panel -->
    <div id="cc-so-panel" style="position:absolute; right:0; top:0; bottom:0; width:600px; background:rgba(18,20,22,0.97); border-left:2px solid #4FB5B5; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 46px; transform:translateX(104%); overflow:hidden;">
      <div style="position:absolute; top:-2px; left:-2px; width:38px; height:38px; border-top:2px solid #4FB5B5; border-left:2px solid #4FB5B5;"></div>
      <div style="position:absolute; top:-2px; right:-2px; width:38px; height:38px; border-top:2px solid #4FB5B5; border-right:2px solid #4FB5B5;"></div>
      <div style="position:absolute; bottom:-2px; left:-2px; width:38px; height:38px; border-bottom:2px solid #4FB5B5; border-left:2px solid #4FB5B5;"></div>

      latestLbl: $('cc-latest-lbltxt'), latestName: $('cc-latest-name'), latestSub: $('cc-latest-sub'),
      latestDots: $('cc-latest-dots'), latestTick: $('cc-latest-tick'),
      compact: $('cc-compact'), compactCard: $('cc-compact-card'), compactCtr: $('cc-compact-ctr'),
      compactSweep: $('cc-compact-sweep'), compactAvwrap: $('cc-compact-avwrap'), compactAv: $('cc-compact-av'),
      compactDiamond: $('cc-compact-diamond'), compactLbl: $('cc-compact-lbltxt'), compactName: $('cc-compact-name'), compactMsg: $('cc-compact-msg'),
    };

    // big-alert queue is this.queue; compact has its own
    this.cQueue = [];
    this.cShowing = false;
    this.COMPACT_TYPES = new Set(['redeem', 'alert', 'outraid', 'streamstart']);

    const p = new URLSearchParams(location.search);
    // Default = clean production overlay (transparent, no panel, connects WS, sound on).
    // Demo panel + preview backdrop + teaser only with ?demo=1.
    const demo = p.get('demo') === '1';
    this.demoMode = demo;
    this.muted = demo; // im Demo/Review stumm; im Live-Betrieb hörbar

    this.ctx = this.els.canvas.getContext('2d');
    this.reaperImgs = [];
    ['assets/reaper_sovereign.png', 'assets/reaper_omen.png'].forEach(src => {
      const im = new Image(); im.src = src; this.reaperImgs.push(im);
    });

    // Preload + buffer each sound once. Reusing a loaded element is far more
    // reliable than `new Audio()` per event (avoids cold-load / autoplay drops).
    this.sndSrc = {
      'snd-follow': 'sounds/sound_follow.mp3', 'snd-sub': 'sounds/sound_sub.mp3',
      'snd-bits': 'sounds/sound_bits.mp3', 'snd-bomb': 'sounds/sound_bomb.mp3',
      'snd-raid': 'sounds/sound_raid.mp3', 'snd-redeem': 'sounds/sound_redeem.mp3',
      'snd-hype': 'sounds/sound_hype.mp3', 'snd-outraid': 'sounds/sound_outraid.mp3',
      'snd-rip': 'sounds/sound_rip.mp3', 'snd-selfie': 'sounds/sound_selfie.mp3',
      'snd-alert': 'sounds/sound_alert.ogg',
    };
    this.snd = {};
    Object.entries(this.sndSrc).forEach(([k, src]) => {
      const a = new Audio(); a.src = src; a.preload = 'auto'; a.volume = 0.7;
      try { a.load(); } catch (e) {}
      this.snd[k] = a;
    });
    this.startParticleLoop();
    this.buildDemoPanel();
    this.initLatest();

    // ?demo=1 → demo panel; otherwise live (Streamerbot + admin test WS)
    if (demo) {
      this.showDemo();
    } else {
      this.connect();
      this.connectAdmin();
    }

    // ?test=raid style
    if (p.get('test')) {
      setTimeout(() => this.enqueue(p.get('test'), {
        user: p.get('user') || 'TestPilot', amount: p.get('amount') || 100,
        tier: p.get('tier') || '1000', avatar: p.get('avatar') || '',
        reward: p.get('reward') || '', rewardName: p.get('reward') || '',
        months: p.get('months') || '', level: p.get('level') || '',
        game: p.get('game') || '', duration: p.get('duration') || '',
      }), 800);
    }
  }

  // ──────────────── CANVAS PARTICLES ────────────────
  startParticleLoop() {
    const tick = () => {
      const ctx = this.ctx;
      ctx.clearRect(0, 0, 1920, 1080);
      this.drawFleet(ctx);
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i];
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.99; p.life -= p.decay;
        if (p.life <= 0) { this.particles.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life)) * p.alpha;
        ctx.fillStyle = p.color;
        // Flat particles. shadowBlur is a canvas glow, and glow is out
        // of the identity - the particle reads on its own colour.
        if (p.shape === 'square') {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size * p.life, p.size * p.life);
          ctx.restore();
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * Math.max(0.2, p.life), 0, Math.PI * 2);
          ctx.fill();
        }
        p.rot += p.spin;
      }
      ctx.globalAlpha = 1;
      this.rafId = requestAnimationFrame(tick);
    };
    tick();
  }

  burst(x, y, color, count, opts = {}) {
    const spread = opts.spread || 6;
    const up = opts.up || 0;
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = (opts.minSpd || 2) + Math.random() * (opts.maxSpd || 9);
      this.particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - up,
        g: opts.g != null ? opts.g : 0.12,
        size: (opts.minSize || 3) + Math.random() * (opts.maxSize || 6),
        color: Array.isArray(color) ? color[Math.floor(Math.random() * color.length)] : color,
        life: 1, decay: 0.008 + Math.random() * 0.012,
        alpha: 0.9, shape: Math.random() > 0.45 ? 'square' : 'circle',
        rot: Math.random() * Math.PI, spin: (Math.random() - 0.5) * 0.3,
      });
    }
  }

  fireworks(color) {
    // multiple bursts across upper area
    const cols = Array.isArray(color) ? color : [color, '#C48A4A', '#4FB5B5'];
    let n = 0;
    const launch = () => {
      if (n >= 6) return;
      const x = 400 + Math.random() * 1120;
      const y = 200 + Math.random() * 360;
      this.burst(x, y, cols, 55, { minSpd: 2, maxSpd: 11, g: 0.06, minSize: 2, maxSize: 5 });
      n++;
      setTimeout(launch, 320);
    };
    launch();
  }

  // ──────────────── INCOMING FLEET (raid) ────────────────
  launchFleet(opts = {}) {
    const cx = 960, cy = 470;
    const color = opts.color || '#EE6E76';
    const count = opts.count || 6;
    this.fleet = { t0: performance.now(), dur: opts.dur || 9000, color, cx, cy };
    // warp streak field rushing outward from a vanishing point
    this.warp = [];
    for (let i = 0; i < 120; i++) {
      const ang = Math.random() * Math.PI * 2;
      this.warp.push({ ang, r: Math.random() * 200, spd: 3 + Math.random() * 14, len: 20 + Math.random() * 90 });
    }
    // ships emerge from the vanishing point and grow as they approach
    this.ships = [];
    for (let i = 0; i < count; i++) {
      this.ships.push({
        ox: (Math.random() * 2 - 1) * 760,   // final horizontal offset from center
        oy: (Math.random() * 2 - 1) * 230,
        delay: i * 520 + Math.random() * 180,
        grow: 3200 + Math.random() * 1400,    // ms to reach full size
        maxScale: 0.62 + Math.random() * 0.7,
        sway: Math.random() * Math.PI * 2,
        imgIdx: i % 2,
        lead: i === 0,
      });
    }
  }

  drawFleet(ctx) {
    if (!this.fleet) return;
    const f = this.fleet;
    const now = performance.now();
    const elapsed = now - f.t0;
    if (elapsed > f.dur) { this.fleet = null; this.warp = null; this.ships = null; return; }
    // global fade in/out envelope
    const fadeIn = Math.min(elapsed / 600, 1);
    const fadeOut = Math.min(Math.max((f.dur - elapsed) / 900, 0), 1);
    const env = fadeIn * fadeOut;

    // ── warp streaks ──
    ctx.save();
    ctx.globalAlpha = 0.5 * env;
    ctx.strokeStyle = f.color;
    ctx.lineWidth = 1.4;
    for (const w of this.warp) {
      w.r += w.spd * (1 + w.r / 600);
      if (w.r > 1300) { w.r = Math.random() * 60; }
      const sx = f.cx + Math.cos(w.ang) * w.r;
      const sy = f.cy + Math.sin(w.ang) * w.r * 0.62;
      const ex = f.cx + Math.cos(w.ang) * (w.r + w.len);
      const ey = f.cy + Math.sin(w.ang) * (w.r + w.len) * 0.62;
      ctx.globalAlpha = 0.5 * env * Math.min(w.r / 300, 1);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    }
    ctx.restore();

    // ── ships (far → near) ──
    for (const s of this.ships) {
      const t = (elapsed - s.delay);
      if (t < 0) continue;
      const p = Math.min(t / s.grow, 1);
      const ease = p * p; // accelerate toward viewer
      const scale = 0.04 + ease * s.maxScale;
      const swayX = Math.sin(now / 1000 + s.sway) * 10 * p;
      const x = f.cx + s.ox * ease + swayX;
      const y = f.cy + s.oy * ease - 30 * (1 - p);
      const a = env * Math.min(p * 2.4, 1);
      const im = this.reaperImgs && this.reaperImgs[s.imgIdx];
      if (im && im.complete && im.naturalWidth) {
        const h = scale * 720;
        const w = h * (im.naturalWidth / im.naturalHeight);
        // The hull used to sit on a radial haze and carry a 26px
        // shadowBlur. Both are gone: a gradient and a glow are the two
        // treatments the brand rules out first. The approach reads
        // through scale and opacity, which is motion, not surface.
        ctx.save();
        ctx.globalAlpha = a;
        ctx.drawImage(im, x - w / 2, y - h * 0.46, w, h);
        ctx.restore();
      } else {
        this.drawReaper(ctx, x, y, scale * 260, f.color, a, now);
      }
    }
  }

  // a menacing original capital-ship silhouette: tall spire body + long splayed legs, rim-lit
  drawReaper(ctx, x, y, size, color, alpha, now) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 100, size / 100);
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    const rim = this.rgbaOf(color, 0.55);

    // ── tall pointed spire + segmented hull ──
    ctx.beginPath();
    ctx.moveTo(0, -128);                       // tip
    ctx.bezierCurveTo(7, -96, 11, -64, 15, -34); // right edge of spire
    ctx.lineTo(24, 4);                          // right shoulder
    ctx.bezierCurveTo(30, 22, 26, 40, 14, 50);  // right lower hull
    ctx.lineTo(-14, 50);
    ctx.bezierCurveTo(-26, 40, -30, 22, -24, 4);
    ctx.lineTo(-15, -34);
    ctx.bezierCurveTo(-11, -64, -7, -96, 0, -128);
    ctx.closePath();
    // Flat Space fill with a 1.4px rim in the event colour. The three
    // shadowBlur passes that used to rim-light this hull are gone.
    ctx.fillStyle = '#121416';
    ctx.fill();
    ctx.lineWidth = 1.4; ctx.strokeStyle = color;
    ctx.stroke();

    // hull plating lines
    ctx.strokeStyle = this.rgbaOf(color, 0.32); ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(0, -120); ctx.lineTo(0, 44); ctx.stroke();         // central ridge
    [-78, -40, -6].forEach(yy => {                                                // cross segments
      const w = (yy + 128) * 0.16 + 4;
      ctx.beginPath(); ctx.moveTo(-w, yy); ctx.lineTo(w, yy); ctx.stroke();
    });

    // ── side fins (the upper arms) ──
    [1, -1].forEach(dir => {
      ctx.beginPath();
      ctx.moveTo(dir * 22, -6);
      ctx.lineTo(dir * 50, 6);
      ctx.lineTo(dir * 44, 22);
      ctx.lineTo(dir * 20, 14);
      ctx.closePath();
      ctx.fillStyle = '#121416'; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = rim; ctx.stroke();
    });

    // ── long curved legs splaying down ──
    ctx.lineCap = 'round';
    const legs = 7;
    for (let i = 0; i < legs; i++) {
      const f = (i / (legs - 1)) - 0.5;            // -0.5..0.5
      const baseX = f * 34;
      const kneeX = f * 96;
      const tipX = f * 150;
      const wob = Math.sin(now / 560 + i * 1.3) * 5;
      ctx.beginPath();
      ctx.moveTo(baseX, 44);
      ctx.bezierCurveTo(baseX * 1.4, 84, kneeX, 120, tipX + wob, 196 + Math.abs(f) * 26);
      ctx.lineWidth = 6.5 - Math.abs(f) * 5;
      ctx.strokeStyle = '#121416'; ctx.stroke();      // dark body
      ctx.lineWidth = 1; ctx.strokeStyle = rim; ctx.stroke(); // rim line
    }

    // ── core (charging beam) on the underside ──
    // Pulsing opacity, not a 34px bloom: motion is allowed, glow is not.
    const pulse = 0.5 + 0.5 * Math.sin(now / 200);
    ctx.fillStyle = color;
    ctx.globalAlpha *= 0.5 + pulse * 0.5;
    ctx.beginPath(); ctx.ellipse(0, 20, 5.5, 16, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ──────────────── AUDIO ────────────────
  playSound(id) {
    if (!id || this.muted) return;
    const a = this.snd && this.snd[id];
    if (!a) return;
    try {
      a.currentTime = 0;
      a.volume = 0.7;
      const p = a.play();
      // If a reused element is mid-play, retry once on a fresh clone (autoplay/seek race).
      if (p && p.catch) p.catch(() => { try { const c = new Audio(this.sndSrc[id]); c.volume = 0.7; c.play().catch(() => {}); } catch (e) {} });
    } catch (e) {}
  }

  // ──────────────── FLASH ────────────────
  flash(color, count, cb, on, off) {
    on = on || this.FLASH_ON; off = off || this.FLASH_OFF;
    let n = 0;
    const step = () => {
      if (n >= count * 2) { this.els.flash.style.background = 'transparent'; if (cb) cb(); return; }
      this.els.flash.style.background = (n % 2 === 0) ? color : 'transparent';
      n++;
      setTimeout(step, (n % 2 === 1) ? on : off);
    };
    step();
  }

  // ──────────────── DEBUG ────────────────
  dbg(msg, type = 'info') {
    const colors = { info: 'rgba(79,181,181,0.85)', ok: '#63C271', warn: '#EBCF52', err: '#EE6E76' };
    const prefix = { info: '●', ok: '✓', warn: '⚠', err: '✗' };
    const time = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const line = document.createElement('div');
    // This line read `color:${colors[type]};}40;` - a text-shadow
    // removal had left the tail of the old declaration behind, so
    // every log row shipped an invalid rule.
    line.style.color = colors[type];
    line.textContent = `${time}  ${prefix[type]}  ${msg}`;
    this.els.dbgLines.appendChild(line);
    while (this.els.dbgLines.children.length > 10) this.els.dbgLines.removeChild(this.els.dbgLines.firstChild);
    if (this.dbgFade) clearTimeout(this.dbgFade);
    this.els.dbg.style.opacity = '1';
    this.dbgFade = setTimeout(() => { this.els.dbg.style.opacity = '0.25'; }, 15000);
  }

  monthsBadge(months) {
    if (!months || months < 2) return null;
    let lbl = months + ' MONATE';
    if (months >= 12) lbl = Math.floor(months / 12) + (months >= 24 ? ' JAHRE' : ' JAHR') + (months % 12 > 0 ? ' ' + (months % 12) + 'M' : '');
    return { num: months, lbl };
  }

  // ──────────────── ALERT CONFIG ────────────────
  buildAlert(type, data) {
    const user = data.user || data.userName || data.displayName || '???';
    const amount = parseInt(data.amount || data.bits || data.quantity || data.viewers || 0, 10);
    const avatar = data.avatar || data.profileImageUrl || '';
    const tier = data.tier || '1000';
    const months = parseInt(data.months || data.cumulativeMonths || 0, 10);
    const reward = (data.reward || data.rewardName || '').toLowerCase().trim();
    const level = parseInt(data.level || 1, 10);
    const recipient = data.recipient || data.recipientDisplayName || data.recipientUserName || '';
    // Emphasis inside an alert sentence. Body copy is never Copper -
    // this used to wrap every highlight in the accent, which put four
    // or five Copper runs into a two-line message.
    const H = (s) => `<span class="cc-em">${s}</span>`;

    switch (type) {
      case 'follow':
        return { label: 'NEUES CREWMITGLIED', user,
          msg: `${H(user)} ist der Chaos Crew beigetreten.<br>Willkommen im Team der Chaoten!`,
          avatar, sound: 'snd-follow', frame: 'cyan',
          fx: 'burst', fxColor: ['#4FB5B5', '#4FB5B5'], duration: 6500 };

      case 'sub': {
        const high = (tier === '2000' || tier === '3000');
        return { label: high ? 'TIER ' + (tier === '2000' ? '2' : '3') + ' ABO' : 'NEUES ABONNEMENT',
          user,
          msg: high ? `Danke ${H(user)}!<br>Scheiß aufs Tanken – wir kaufen ein neues Schiff.`
            : `${H(user)} sichert die Nachschublinien.<br>Wir können wieder tanken!`,
          avatar, sound: 'snd-sub', frame: 'gold', glitch: true, duration: 7000 };
      }

      case 'resub': {
        const high = (tier === '2000' || tier === '3000');
        const badge = this.monthsBadge(months);
        const isMs = this.MILESTONES.includes(months);
        return { label: isMs ? '⭐ MEILENSTEIN' : '⟳ TREUER CREWMANN',
          user,
          msg: high ? `${H(user)} bleibt dabei – Tier ${tier === '2000' ? '2' : '3'}!`
            : `${H(user)} ist weiterhin an Bord.${months >= 2 ? '<br>' + H(months + ' Monate') + ' Dienst für die Crew.' : ''}`,
          avatar, stat: badge, sound: isMs ? 'snd-bomb' : 'snd-sub', frame: 'gold',
          glitch: isMs, fx: isMs ? 'fireworks' : null, fxColor: ['#C48A4A', '#4FB5B5', '#F2F2F0'], duration: 7500 };
      }

      case 'bits': case 'cheer':
        return { label: 'BITS EINGETROFFEN', user,
          msg: `${H(user)} lässt ${H(amount + ' Bits')} in der Kaffeekasse.<br>Das hält die Crew wach.`,
          avatar, stat: { num: amount, lbl: 'BITS', count: true }, sound: 'snd-bits',
          frame: 'gold', duration: 7000 };

      case 'subgift':
        // Einzelnes Gift-Sub: Schenker → Empfänger. amount>1 wäre eine Bombe → fällt unten durch.
        if (amount <= 1 && recipient) {
          return { label: '🎁 ABO VERSCHENKT', user,
            msg: `${H(user)} schenkt ${H(recipient)} ein Abo.<br>Willkommen an Bord, Crewmann!`,
            avatar, sound: 'snd-sub', frame: 'gold', duration: 7000 };
        }
        // fällt durch zu Bombe (Mehrfach-Gift ohne Empfänger)
      case 'subbomb': case 'giftbomb':
        return { label: '⚡ SUBBOMBE EINGESCHLAGEN', user,
          msg: `${H(user)} versorgt die Flotte mit<br>${H('+' + amount + ' Subs')} — Stärke gesteigert!`,
          avatar, avatarLarge: true, stat: { num: '+' + amount, lbl: 'SUBS' }, sound: 'snd-bomb',
          frame: 'gold', entrance: 'pop', fx: 'fireworks', fxColor: ['#C48A4A', '#4FB5B5', '#F2F2F0'], duration: 9000 };

      case 'raid':
        return { label: '\u{1F6A8} ALARM — EINGEHENDER RAID', user, labelColor: '#EE6E76',
          msg: `${H(user)} führt ${H(amount + ' Piloten')} in den Angriff!<br>SHIELDS HOCH. ALLE MANN AN DIE GESCHÜTZE!`,
          avatar, avatarLarge: true, stat: { num: amount, lbl: 'RAIDER', count: true }, sound: 'snd-raid',
          frame: 'raid', entrance: 'slam', fleet: true, flash: 'rgba(238,110,118,0.42)', flashCount: 6, flashOn: 80, flashOff: 100,
          fx: 'burst', fxColor: ['#EE6E76', '#EE6E76'], duration: 10000 };

      case 'outraid':
        return { label: '\u{1F680} RAID GESTARTET', user,
          msg: `Die Chaos Crew verlässt die Station.<br>Kurs: ${H(user)} — ${H('Quantum Jump')} initiiert.`,
          avatar, stat: { num: amount, lbl: 'PILOTEN', count: true }, sound: 'snd-outraid',
          frame: 'cyan', duration: 7000 };

      case 'hypetrain': {
        const labels = ['', 'HYPE TRAIN LVL 1', 'HYPE TRAIN LVL 2', 'HYPE TRAIN LVL 3', 'HYPE TRAIN LVL 4', '⚡ HYPE TRAIN LVL 5 — MAX'];
        const msgs = ['', 'Die Triebwerke werden warm.', 'Wir beschleunigen — Vollgas!', 'Quantenantrieb aktiv!',
          'Wir brechen die Schallmauer!', 'MAXIMALE ENERGIE — CHAOS PUR!'];
        const lv = Math.min(Math.max(level, 1), 5);
        return { label: labels[lv], user: '— CHAOS CREW —', labelColor: '#63C271',
          msg: `${H('Level ' + lv)} erreicht!<br>${msgs[lv]}`,
          stat: { num: 'LVL ' + lv, lbl: 'HYPE' }, sound: 'snd-hype', frame: 'green',
          shake: lv >= 3, glitch: lv >= 4, fx: lv === 5 ? 'fireworks' : null, fxColor: ['#63C271', '#4FB5B5'],
          duration: lv === 5 ? 9500 : 7000 };
      }

      case 'streamstart':
        return { label: 'MISSION GESTARTET', user: 'CHAOS CREW',
          msg: `Alle Systeme online. Besatzung – ${H('Stationen einnehmen.')}<br>Der Stream ist heiß. Let's fly.`,
          sound: 'snd-follow', frame: 'cyan', duration: 8000 };

      case 'alert':
        return { label: '\u{1F6A8} RED ALERT — SIRENE', user, labelColor: '#EE6E76',
          msg: `${H(user)} hat Alarmstufe Rot ausgelöst.<br>${H('Alle Mann auf Gefechtsstationen!')}`,
          avatar, sound: 'snd-alert', frame: 'raid', glitch: true,
          flash: 'rgba(238,110,118,0.42)', flashCount: 5, fx: 'burst', fxColor: ['#EE6E76'], duration: 6000 };

      case 'redeem': return this.buildRedeem(reward, data, user, avatar, H);

      default: return null;
    }
  }

  buildRedeem(reward, data, user, avatar, H) {
    const REWARDS = {
      'erschreck den streamer. alarm!': { label: '\u{1F6A8} RED ALERT — SIRENE',
        msg: `${H(user)} hat Alarmstufe Rot ausgelöst.<br>${H('Alle Mann auf Gefechtsstationen!')}`,
        sound: 'snd-alert', frame: 'raid', glitch: true,
        flash: 'rgba(238,110,118,0.42)', flashCount: 5, fx: 'burst', fxColor: ['#EE6E76', '#EE6E76'] },
      'mach ein selfie und poste es sofort': { label: 'CREW-BEFEHL',
        msg: `${H(user)} hat gesprochen.<br>Kamera drauf, Selfie raus – ${H('sofort.')}`,
        sound: 'snd-selfie', frame: 'cyan',
        flash: 'rgba(242,242,240,0.55)', flashCount: 2, flashOn: 60, flashOff: 90, fx: 'burst', fxColor: ['#F2F2F0', '#F2F2F0'] },
      'mach kamera aus!': { label: 'CREW-BEFEHL',
        msg: `${H(user)} möchte Privatsphäre.<br>Kamera aus. ${H('Befehl ausgeführt.')}`,
        sound: 'snd-redeem', frame: 'cyan' },
      'paulcontent': { label: 'ANFORDERUNG',
        msg: `${H(user)} fordert ${H('PAULCONTENT')}.<br>Die Crew wartet. Paul – dein Einsatz.`,
        sound: 'snd-redeem', frame: 'gold', glitch: true,
        flash: 'rgba(196,138,74,0.3)', flashCount: 3, fx: 'burst', fxColor: ['#C48A4A', '#F2F2F0'] },
      'rip': { label: 'VERLUSTE GEMELDET', labelColor: '#EE6E76',
        msg: `${H(user)} hat RIP gedrückt.<br>Möge der Respawn gnädig sein. ${H('o7')}`,
        sound: 'snd-rip', frame: 'raid',
        flash: 'rgba(238,110,118,0.5)', flashCount: 3, flashOn: 200, flashOff: 120 },
      'trink was bitte': { label: 'VERSORGUNGSBEFEHL',
        msg: `${H(user)} befiehlt Flüssigkeitszufuhr.<br>${H('Trinken. Jetzt. Das ist ein Befehl.')}`,
        sound: 'snd-redeem', frame: 'cyan' },
      'was macht antje': { label: 'CREW-NACHFRAGE',
        msg: `${H(user)} fragt nach Antje.<br>Navigationsoffizierin – ${H('bitte melden!')}`,
        sound: 'snd-redeem', frame: 'cyan' },
      'zieh mütze aus': { label: 'CREW-BEFEHL',
        msg: `${H(user)} besteht auf Kopffreiheit.<br>${H('Mütze ab. Respekt zeigen.')}`,
        sound: 'snd-redeem', frame: 'cyan' },
    };
    const cfg = REWARDS[reward];
    if (!cfg) {
      return { label: 'CHANNEL REWARD', user,
        msg: `${H(user)} hat einen Reward eingelöst:<br>${H(data.reward || data.rewardName || '???')}`,
        avatar, sound: 'snd-redeem', frame: 'cyan', duration: 6000 };
    }
    return Object.assign({ user, avatar, duration: 6500 }, cfg);
  }

  // ──────────────── QUEUE ────────────────
  enqueue(type, data) {
    // Profil-Steckbrief (!id): eigener Vollbild-Panel, NICHT ins Latest-Widget.
    // 'profile'         = fertiges Payload (z.B. Admin-Test, server-aggregiert)
    // 'profile_request' = Rohfelder von CC_Id.cs → Browser reichert via API an
    if (type === 'profile') { this.showProfile(data); return; }
    if (type === 'profile_request') { this.loadProfileRequest(data); return; }

    // feed the persistent "latest" widget
    this.updateLatest(type, data);

    if (type === 'shoutout') { this.showShoutout(data); return; }
    if (type === 'resub') {
      const mo = parseInt(data.months || data.cumulativeMonths || 0, 10);
      const isMs = this.MILESTONES.includes(mo);
      if (mo >= 12 || isMs) { this.showResubFs(data, isMs); }
    }

    const cfg = this.buildAlert(type, data);
    if (!cfg) { this.dbg(`Unbekannt: ${type}`, 'warn'); return; }
    this.dbg(`Alert: ${type} ← ${data.user || '?'}`, 'ok');

    // route: minor events → compact corner channel; important → big center
    if (this.COMPACT_TYPES.has(type)) {
      this.cQueue.push(cfg);
      if (!this.cShowing) this.processCompact();
    } else {
      this.queue.push(cfg);
      if (!this.isShowing) this.processQueue();
    }
  }

  processQueue() {
    if (!this.queue.length) { this.isShowing = false; return; }
    this.isShowing = true;
    const next = this.queue.shift();
    try { this.showAlert(next); }
    catch (e) { this.dbg('ERR: ' + e.message, 'err'); this.isShowing = false; setTimeout(() => this.processQueue(), 500); }
  }

  processCompact() {
    if (!this.cQueue.length) { this.cShowing = false; return; }
    this.cShowing = true;
    const next = this.cQueue.shift();
    try { this.showCompact(next); }
    catch (e) { this.dbg('cERR: ' + e.message, 'err'); this.cShowing = false; setTimeout(() => this.processCompact(), 500); }
  }

  // ──────────────── SHOW ALERT ────────────────
  showAlert(cfg) {
    const E = this.els;
    // content
    E.lbl.textContent = cfg.label;
    // The event label is the one Copper element besides the signet -
    // unless the event IS a state, in which case it takes the
    // functional colour. It is always also spelled out in words.
    E.lbl.parentElement.style.color = cfg.labelColor || '#C48A4A';

    // Michroma has ONE cut. There is no 900, and asking for one makes
    // the browser synthesise a visibly broken bold. Size is the only
    // emphasis, and it steps by content length, not by event type.
    E.user.textContent = '';
    E.user.style.fontFamily = 'var(--rdoc-font-display)';
    E.user.style.fontSize = (String(cfg.user || '').length > 14 ? '32px' : '42px');
    E.user.style.fontWeight = '400';
    E.user.style.letterSpacing = '0';
    E.user.style.color = '#F2F2F0';
    E.msg.innerHTML = cfg.msg || '';
    E.msg.style.animation = 'none';

    // avatar
    if (cfg.avatar) {
      E.avimg.src = cfg.avatar;
      const sz = cfg.avatarLarge ? 124 : 96;
      E.avimg.style.width = sz + 'px'; E.avimg.style.height = sz + 'px';
      E.avwrap.style.display = 'block';
    } else { E.avwrap.style.display = 'none'; }

    // reset
    E.frame.className = '';
    E.anim.className = '';
    E.anim.style.animation = 'none';
    E.anim.style.opacity = '0';
    [E.ctl, E.ctr, E.cbl, E.cbr].forEach(c => c.classList.remove('drawn'));
    E.ltop.classList.remove('drawn'); E.lbot.classList.remove('drawn');
    E.msg.style.animation = 'none';
    E.msg.style.opacity = '1';
    E.stat.style.opacity = '0'; E.stat.style.transform = 'translateX(22px)';
    E.glow.style.opacity = '0';
    E.avimg.classList.remove('cc-decrypt');
    E.user.classList.remove('cc-glitch');
    void E.anim.offsetWidth;

    this.playSound(cfg.sound);

    const reveal = () => {
      // frame border type
      E.frame.classList.add('cc-frame-' + (cfg.frame || 'cyan'));
      if (cfg.shake) E.anim.classList.add('cc-anim-hype');
      // entrance variant per event type
      const ent = cfg.entrance === 'slam' ? ['ccAlertSlam', '0.6s'] :
                  cfg.entrance === 'pop' ? ['ccAlertPop', '0.55s'] :
                  ['ccAlertIn', '0.6s'];
      E.anim.style.animation = `${ent[0]} ${ent[1]} cubic-bezier(0.22,1,0.36,1) forwards`;
      E.anim.style.opacity = '1';
      // rest on clean inline styles after entrance (keeps shake if any)
      setTimeout(() => {
        if (E.anim.style.animation.indexOf(ent[0]) !== -1) {
          E.anim.style.animation = cfg.shake ? '' : 'none';
          E.anim.style.transform = cfg.shake ? '' : 'none';
          E.anim.style.opacity = '1';
        }
      }, 660);
      // corners
      setTimeout(() => { [E.ctl, E.ctr, E.cbl, E.cbr].forEach(c => c.classList.add('drawn')); }, 90);
      setTimeout(() => { E.ltop.classList.add('drawn'); E.lbot.classList.add('drawn'); }, 150);
      setTimeout(() => { E.glow.style.opacity = '1'; }, 200);
      if (cfg.avatar) setTimeout(() => E.avimg.classList.add('cc-decrypt'), 280);
      // username flies in letter-by-letter
      setTimeout(() => this.flyInLetters(E.user, (cfg.user || '').toUpperCase(),
        { base: 0, step: 30, spread: 36, rot: 22, up: false, dur: 0.5 }), 300);
      // message builds up after the name (backwards fill keeps it hidden during delay, rests visible)
      E.msg.style.animation = 'ccRiseFade 0.5s ease-out 0.55s backwards';

      // stat
      if (cfg.stat) {
        E.statLbl.textContent = cfg.stat.lbl;
        if (cfg.stat.count && typeof cfg.stat.num === 'number') {
          E.statNum.textContent = '0';
          setTimeout(() => this.countUp(E.statNum, cfg.stat.num, 1100), 520);
        } else { E.statNum.textContent = cfg.stat.num; }
        E.stat.style.display = 'block';
        setTimeout(() => { E.stat.style.opacity = '1'; E.stat.style.transform = 'translateX(0)'; }, 500);
      } else { E.stat.style.display = 'none'; }

      // particles
      if (cfg.fx) {
        setTimeout(() => {
          if (cfg.fx === 'fireworks') this.fireworks(cfg.fxColor);
          else this.burst(960, 880, cfg.fxColor, 44, { up: 3, minSpd: 3, maxSpd: 10 });
        }, 220);
      }
      // incoming fleet (raid)
      if (cfg.fleet) this.launchFleet({ color: '#EE6E76', count: 6, dur: (cfg.duration || 10000) - 1200 });

      // exit
      setTimeout(() => this.hideAlert(), cfg.duration || this.SHOW_MS);
    };

    if (cfg.flash) {
      this.flash(cfg.flash, cfg.flashCount || 4, reveal, cfg.flashOn, cfg.flashOff);
    } else { reveal(); }
  }

  hideAlert() {
    const E = this.els;
    [E.ctl, E.ctr, E.cbl, E.cbr].forEach(c => c.classList.remove('drawn'));
    E.ltop.classList.remove('drawn'); E.lbot.classList.remove('drawn');
    E.stat.style.opacity = '0'; E.glow.style.opacity = '0';
    E.anim.classList.remove('cc-anim-hype');
    E.anim.style.animation = 'ccAlertOut 0.5s ease-in forwards';
    setTimeout(() => {
      E.anim.style.opacity = '0';
      E.anim.style.animation = 'none';
      E.frame.className = '';
      this.processQueue();
    }, 540);
  }

  countUp(el, target, ms) {
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min((now - start) / ms, 1);
      const e = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.floor(target * e).toLocaleString('de-DE');
      if (t < 1) requestAnimationFrame(tick);
      else el.textContent = target.toLocaleString('de-DE');
    };
    requestAnimationFrame(tick);
  }

  // Composes an rgba() from a palette hex. It was called hexGlow when
  // the overlay still painted glows; nothing here glows any more.
  rgbaOf(color, a = 0.9) {
    if (!color) return `rgba(79,181,181,${a})`;
    if (color === '#4FB5B5') return `rgba(79,181,181,${a})`;
    if (color === '#C48A4A') return `rgba(196,138,74,${a})`;
    if (color === '#EE6E76') return `rgba(238,110,118,${a})`;
    if (color === '#63C271') return `rgba(99,194,113,${a})`;
    return `rgba(79,181,181,${a})`;
  }

  // ──────────────── SHOUTOUT ────────────────
  showShoutout(data) {
    const E = this.els;
    const user = data.user || data.userName || '???';
    const avatar = data.avatar || data.profileImageUrl || '';
    const game = data.game || data.lastGame || '';
    // Hold time before the exit runs. CC_Shoutout.cs sends no duration,
    // so this default is what actually ships.
    const dur = parseInt(data.duration || 8000, 10);
    const U = user.toUpperCase();

    E.soAmbient.textContent = U;
    E.soBigName.textContent = U;
    E.soBigUrl.textContent = 'TWITCH.TV/' + user.toUpperCase();
    E.soGame.textContent = game ? '▶ ZULETZT: ' + game.toUpperCase() : '';
    // Fallback sofort sichtbar; AI-Summary (falls verfügbar) ersetzt ihn asynchron.
    this.setSoMsg(`Schaut bei ${U} vorbei! Die Crew empfiehlt diesen Kanal. o7`, false);
    this.loadShoutoutSummary(user, game, data);
    E.soUrl.textContent = 'twitch.tv/' + user.toLowerCase();
    if (avatar) { E.soAv.src = avatar; E.soAv.style.visibility = 'visible'; } else { E.soAv.style.visibility = 'hidden'; }

    // reset
    E.soName.textContent = '';
    E.soCursor.style.display = 'inline-block';
    E.soHdr.style.opacity = '0'; E.soBigName.style.opacity = '0'; E.soBigUrl.style.opacity = '0';
    E.soPanel.style.animation = 'none'; E.soPanel.style.transform = 'translateX(104%)';
    E.soText.style.animation = 'none'; E.soText.style.transform = 'translateX(0)'; E.soText.style.opacity = '1';
    E.soAmbient.style.transition = 'none'; E.soAmbient.style.opacity = '1';
    E.soAv.classList.remove('cc-decrypt');
    E.so.style.opacity = '1';
    void E.soPanel.offsetWidth;

    // Shoutout spielt bewusst KEINEN Ton.
    // backdrop
    E.soBg.style.background = 'rgba(18,20,22,0.84)';
    // scan beam right -> left
    E.soBeam.style.transition = 'none'; E.soBeam.style.right = '-4px'; E.soBeam.style.opacity = '1';
    void E.soBeam.offsetWidth;
    E.soBeam.style.transition = 'right 1.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s';
    E.soBeam.style.right = '101%';
    setTimeout(() => { E.soBeam.style.opacity = '0'; }, 1100);

    // panel enters as beam passes ~600px from right
    setTimeout(() => {
      E.soPanel.style.animation = 'ccSoPanelIn 0.7s cubic-bezier(0.22,1,0.36,1) forwards';
      E.soHdr.style.opacity = '1';
    }, 560);
    setTimeout(() => { E.soAv.classList.add('cc-decrypt'); }, 1000);
    setTimeout(() => { E.soBigName.style.opacity = '1'; E.soBigUrl.style.opacity = '1'; }, 1150);
    // type name
    setTimeout(() => this.typeIn(E.soName, U, 70, () => {
      setTimeout(() => { E.soCursor.style.display = 'none'; }, 600);
    }), 1250);

    if (this.soTimer) clearTimeout(this.soTimer);
    this.soTimer = setTimeout(() => this.hideShoutout(), dur);
    this.dbg('Shoutout: ' + user, 'ok');
  }

  // Exit in two beats: the centre text tucks to the right first, then
  // it and the image panel leave the frame together.
  //
  // The old exit slid the panel out while the three text lines simply
  // faded where they stood, so the two halves of the shoutout came
  // apart - one walked off, the other dissolved. The text now travels,
  // and the second beat moves both on the same curve and the same
  // duration so they read as one object.
  hideShoutout() {
    const E = this.els;
    const TUCK = 380, OUT = 560;   // OUT carries a longer travel now
    const EASE_OUT = 'cubic-bezier(0.4,0,1,1)';

    // Beat 1 - tuck right. The lines keep their opacity: they are
    // moving, not disappearing.
    E.soText.style.animation = `ccSoTextTuck ${TUCK}ms cubic-bezier(0.4,0,0.6,1) forwards`;

    // Beat 2 - both leave right, with the backdrop and the ambient word.
    setTimeout(() => {
      E.soText.style.animation = `ccSoTextOut ${OUT}ms ${EASE_OUT} forwards`;
      E.soPanel.style.animation = `ccSoPanelOut ${OUT}ms ${EASE_OUT} forwards`;
      E.soAmbient.style.transition = `opacity ${OUT}ms ease-in`;
      E.soAmbient.style.opacity = '0';
      E.soBg.style.background = 'rgba(18,20,22,0)';
    }, TUCK);

    // Park everything off-stage for the next shoutout.
    setTimeout(() => {
      E.so.style.opacity = '0';
      E.soText.style.animation = 'none';
      E.soText.style.transform = 'translateX(0)';
      E.soText.style.opacity = '1';
      E.soPanel.style.animation = 'none';
      E.soPanel.style.transform = 'translateX(104%)';
      E.soAmbient.style.transition = 'none';
      E.soAmbient.style.opacity = '1';
    }, TUCK + OUT + 60);
  }

  // Setzt den Shoutout-Text sicher (textContent → Sonderzeichen/Umlaute korrekt)
  // und skaliert die Schrift herunter bis er in den Panel passt.
  setSoMsg(text, isSummary) {
    const el = this.els.soMsg;
    el.style.textTransform = isSummary ? 'none' : 'uppercase';
    el.style.overflowWrap = 'anywhere';
    el.style.wordBreak = 'break-word';
    el.style.width = '100%';            // sonst max-content im zentrierten Flex → eine Zeile, h. abgeschnitten
    el.style.maxWidth = '100%';
    el.style.maxHeight = '360px';       // Sicherheitsnetz gegen vertikalen Überlauf
    el.style.overflow = 'hidden';
    el.style.transition = 'opacity 0.35s ease';
    el.style.opacity = '0';
    el.textContent = String(text == null ? '' : text);
    this.fitText(el, isSummary ? 17 : 14, 9, 350);
    void el.offsetWidth;
    el.style.opacity = '1';
  }

  // Verkleinert die Schriftgröße bis el.scrollHeight <= maxH (1080-Koordinaten).
  fitText(el, startPx, minPx, maxH) {
    let px = startPx, guard = 80;
    el.style.fontSize = px + 'px';
    while (el.scrollHeight > maxH && px > minPx && guard-- > 0) {
      px -= 1; el.style.fontSize = px + 'px';
    }
  }

  // Reichert den Shoutout an: holt IMMER Avatar (+Bio) via Twitch-API und – falls
  // nicht schon im Payload geliefert – den KI-Empfehlungstext. Avatar ist von der
  // Summary entkoppelt, damit er auch mit fertigem data.summary geladen wird.
  loadShoutoutSummary(user, game, data) {
    const haveSummary = !!(data && data.summary && String(data.summary).trim());
    if (haveSummary) this.setSoMsg(String(data.summary).trim(), true);
    if (this.demoMode) return;                       // im Demo kein Netzwerk
    const login = String(user || '').toLowerCase();
    const token = (this.soReq = (this.soReq || 0) + 1);   // nur jüngste Antwort gilt

    fetch('api/twitch/user/' + encodeURIComponent(login))
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        // ── Avatar IMMER setzen wenn Twitch eine URL liefert ──
        const url = j && (j.profile_image_url || j.avatar);
        if (url) {
          const av = this.els.soAv;
          av.src = url;
          av.style.visibility = 'visible';
          av.classList.remove('cc-decrypt'); void av.offsetWidth; av.classList.add('cc-decrypt');
          this.dbg('Shoutout-Avatar ✓', 'ok');
        } else {
          this.dbg('Shoutout-Avatar: keine URL (Twitch-Creds?)', 'warn');
        }
        // ── Summary nur holen, wenn nicht schon geliefert ──
        if (haveSummary) return;
        const bio = j && j.description ? j.description : '';
        fetch('api/claude/summary', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'shoutout', user, game: game || '', bio }),
        }).then((r) => (r.ok ? r.json() : null)).then((s) => {
          if (token !== this.soReq) return;          // veraltete Antwort verwerfen
          const txt = s && s.summary && s.summary.trim();
          if (txt) { this.setSoMsg(txt, true); this.dbg('Shoutout-Summary ✓', 'ok'); }
        }).catch(() => {});
      })
      .catch((e) => this.dbg('Shoutout-Enrich Fehler: ' + e.message, 'err'));
  }

  // ──────────────── PROFIL / STECKBRIEF (!id) ────────────────
  // CC_Id.cs liefert nur Rohfelder; der Browser reichert über /alerts/api/profile
  // an (Watchtime/Giveaway/Spacefight) und rendert dann den Steckbrief.
  loadProfileRequest(data) {
    fetch('api/profile', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data || {}),
    }).then((r) => (r.ok ? r.json() : null)).then((p) => {
      if (p && p.alertType) this.showProfile(p);
      else this.dbg('Profil-API leer', 'warn');
    }).catch((e) => this.dbg('Profil-API Fehler: ' + e.message, 'err'));
  }

  showProfile(data) {
    const E = this.els;
    const esc = (s) => String(s == null ? '' : s).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
    const user = data.user || data.login || '???';
    const login = String(data.login || user).toLowerCase();

    E.pfName.textContent = String(user).toUpperCase();
    E.pfHandle.textContent = 'AKTE // twitch.tv/' + login;
    if (data.avatar) { E.pfAv.src = data.avatar; E.pfAv.style.visibility = 'visible'; }
    else { E.pfAv.style.visibility = 'hidden'; }

    const fields = Array.isArray(data.fields) ? data.fields : [];
    E.pfGrid.innerHTML = fields.map((f) =>
      `<div class="pf-field"><div class="pf-flabel">${esc(f.label)}</div><div class="pf-fval">${esc(f.value)}</div></div>`).join('');

    const ach = Array.isArray(data.achievements) ? data.achievements : [];
    E.pfAch.innerHTML = ach.length
      ? ach.map((a) => `<span class="pf-badge">${esc(a.icon)} ${esc(a.label)}</span>`).join('')
      : '<span class="pf-badge dim">— noch keine —</span>';

    E.pfStatus.textContent = data.statusLine || '';

    // Von der rechten Kante einschieben (kein Dim-Backdrop, Stream bleibt sichtbar)
    E.pfFrame.style.transition = 'none';
    E.pfFrame.style.transform = 'translate(680px,-50%)';
    void E.pfFrame.offsetWidth;
    E.pf.style.opacity = '1';
    E.pfFrame.style.transition = 'transform 0.6s cubic-bezier(0.22,1,0.36,1)';
    E.pfFrame.style.transform = 'translate(0px,-50%)';
    E.pfAv.classList.remove('cc-decrypt');
    setTimeout(() => E.pfAv.classList.add('cc-decrypt'), 250);
    // !id spielt bewusst KEINEN Ton.

    const dur = parseInt(data.duration || 12000, 10);
    if (this.pfTimer) clearTimeout(this.pfTimer);
    this.pfTimer = setTimeout(() => this.hideProfile(), dur);
    this.dbg('Profil: ' + login, 'ok');
  }

  hideProfile() {
    const E = this.els;
    E.pfFrame.style.transition = 'transform 0.5s ease-in';
    E.pfFrame.style.transform = 'translate(680px,-50%)';
    setTimeout(() => { E.pf.style.opacity = '0'; }, 500);
  }

  typeIn(el, text, ms, cb) {
    el.textContent = '';
    let i = 0;
    const t = setInterval(() => {
      el.textContent = text.slice(0, ++i);
      if (i >= text.length) { clearInterval(t); if (cb) cb(); }
    }, ms);
  }

  // ──────────────── RESUB FULLSCREEN ────────────────
  msLabel(m) {
    if (m >= 12 && m % 12 === 0) { const y = m / 12; return y === 1 ? '1 JAHR AN BORD' : y + ' JAHRE AN BORD'; }
    return m + ' MONATE AN BORD';
  }
  msMsg(user, m, H) {
    if (m === 6) return `${H(user)} ist seit 6 Monaten dabei.<br>Halbes Jahr. ${H('Respekt, Pilot.')}`;
    if (m === 12) return `${H(user)} überlebt ein ganzes Jahr mit uns.<br>Das verdient eine ${H('Medaille. o7')}`;
    if (m === 24) return `${H(user)} – 2 Jahre Chaos Crew.<br>Du weißt was du dir angetan hast. ${H('Danke.')}`;
    if (m === 36) return `3 Jahre. ${H(user)} ist Teil der Möbel.<br>${H('Quantum-Veteran. Unaufhaltbar.')}`;
    return `${H(user)} – ${m} Monate durchgehalten!<br>Die Crew ${H('salutiert.')}`;
  }
  resubMsg(user, m, H) {
    if (m >= 24) return `${H(user)} ist seit über 2 Jahren dabei.<br>${H('Die Crew vergisst das nicht.')}`;
    if (m >= 12) return `${H(user)} – über ein Jahr an Bord.<br>${H('Treue wie Titanpanzerung.')}`;
    return `${H(user)} verlängert den Dienst.<br>${H(m + ' Monate')} für die Crew.`;
  }

  showResubFs(data, isMs) {
    const E = this.els;
    const H = (s) => `<span class="cc-em">${s}</span>`;
    const user = (data.user || data.userName || data.displayName || '???');
    const avatar = data.avatar || data.profileImageUrl || '';
    const m = parseInt(data.months || data.cumulativeMonths || 0, 10);
    const dur = isMs ? 13000 : 11000;

    E.rfsLbl.textContent = isMs ? '⭐ MEILENSTEIN ERREICHT' : '⟳ TREUER CREWMANN';
    E.rfsName.textContent = user.toUpperCase();
    E.rfsBadge.textContent = this.msLabel(m);
    E.rfsMsg.innerHTML = isMs ? this.msMsg(user, m, H) : this.resubMsg(user, m, H);
    if (avatar) { E.rfsAv.src = avatar; E.rfsAv.style.visibility = 'visible'; } else { E.rfsAv.style.visibility = 'hidden'; }

    this.flash(isMs ? 'rgba(196,138,74,0.3)' : 'rgba(79,181,181,0.32)', isMs ? 5 : 3, () => {
      E.rfs.style.background = 'rgba(18,20,22,0.82)';
      E.rfs.style.opacity = '1';
      if (isMs) setTimeout(() => this.fireworks(['#C48A4A', '#4FB5B5', '#F2F2F0']), 200);
    });

    if (this.rfsTimer) clearTimeout(this.rfsTimer);
    this.rfsTimer = setTimeout(() => {
      E.rfs.style.transition = 'opacity 0.8s ease';
      E.rfs.style.opacity = '0';
      setTimeout(() => { E.rfs.style.background = 'rgba(18,20,22,0)'; E.rfs.style.transition = 'opacity 0.6s ease'; }, 850);
    }, dur);
  }

  // ──────────────── FLYING LETTERS ────────────────
  flyInLetters(el, text, opts = {}) {
    const step = opts.step != null ? opts.step : 28;
    const base = opts.base || 0;
    const dur = opts.dur || 0.5;
    const spread = opts.spread != null ? opts.spread : 30;
    const rot = opts.rot != null ? opts.rot : 22;
    el.textContent = '';
    const chars = [...String(text)];
    chars.forEach((ch, i) => {
      const s = document.createElement('span');
      s.textContent = ch === ' ' ? ' ' : ch;
      s.style.display = 'inline-block';
      s.style.willChange = 'transform, opacity';
      const lx = (Math.random() * 2 - 1) * spread;
      const ly = opts.up ? -(20 + Math.random() * 30) : (Math.random() * 2 - 1) * 22 + 14;
      const lr = (Math.random() * 2 - 1) * rot;
      s.style.setProperty('--lx', lx.toFixed(1) + 'px');
      s.style.setProperty('--ly', ly.toFixed(1) + 'px');
      s.style.setProperty('--lr', lr.toFixed(1) + 'deg');
      s.style.animation = `ccLetterIn ${dur}s cubic-bezier(0.2,1.1,0.3,1) ${base + i * step}ms backwards`;
      el.appendChild(s);
    });
  }

  // ──────────────── COMPACT ALERT (top-right) ────────────────
  showCompact(cfg) {
    const E = this.els;
    if (this.latestRunning) this.hideLatestSession();
    // The card is structure and stays Patina. Only the label carries
    // the event colour, and only the sweep is tinted with it.
    const label = cfg.labelColor || '#C48A4A';
    E.compactLbl.parentElement.style.color = label;
    E.compactLbl.textContent = cfg.label;
    E.compactMsg.innerHTML = cfg.msg || '';
    E.compactSweep.style.background = this.rgbaOf(label, 0.12);

    if (cfg.avatar) {
      E.compactAv.src = cfg.avatar;
      E.compactAvwrap.style.display = 'block';
    } else { E.compactAvwrap.style.display = 'none'; }

    // reset + enter (animate the CARD; wrapper opacity is instant)
    E.compact.style.opacity = '1';
    E.compactCard.style.animation = 'none';
    E.compactName.textContent = '';
    E.compactMsg.style.animation = 'none';
    E.compactAv.classList.remove('cc-decrypt');
    void E.compactCard.offsetWidth;
    E.compactCard.style.animation = 'ccCompactIn 0.5s cubic-bezier(0.22,1,0.36,1) backwards';
    E.compactMsg.style.animation = 'ccRiseFade 0.4s ease-out 0.34s backwards';

    this.playSound(cfg.sound);
    if (cfg.flash) this.flash(cfg.flash, cfg.flashCount || 3, () => {}, cfg.flashOn, cfg.flashOff);

    // scan sweep
    E.compactSweep.style.transition = 'none'; E.compactSweep.style.opacity = '1'; E.compactSweep.style.transform = 'translateY(-100%)';
    void E.compactSweep.offsetWidth;
    E.compactSweep.style.transition = 'transform 0.5s ease-out, opacity 0.5s';
    E.compactSweep.style.transform = 'translateY(260%)';
    setTimeout(() => { E.compactSweep.style.opacity = '0'; }, 480);

    if (cfg.avatar) setTimeout(() => E.compactAv.classList.add('cc-decrypt'), 200);
    setTimeout(() => this.flyInLetters(E.compactName, (cfg.user || '').toUpperCase(),
      { base: 0, step: 22, spread: 20, rot: 14, dur: 0.42 }), 220);
    if (cfg.fx === 'burst') setTimeout(() => this.burst(1700, 130, cfg.fxColor, 26, { up: 1, minSpd: 2, maxSpd: 7 }), 240);

    const dur = cfg.duration || 5200;
    setTimeout(() => this.hideCompact(), dur);
  }

  hideCompact() {
    const E = this.els;
    E.compactCard.style.animation = 'ccCompactOut 0.4s ease-in forwards';
    setTimeout(() => {
      E.compact.style.opacity = '0';
      E.compactCard.style.animation = 'none';
      this.processCompact();
    }, 420);
  }

  // ──────────────── LATEST WIDGET (top-right, periodic) ────────────────
  initLatest() {
    this.latest = { follower: null, sub: null, resub: null, giftsub: null };
    this.latestOrder = ['follower', 'sub', 'resub', 'giftsub'];
    this.latestMeta = {
      follower: { label: 'Letzter Follower', glyph: '✦' },
      sub: { label: 'Letztes Abo', glyph: '★' },
      resub: { label: 'Letzter Resub', glyph: '⟳' },
      giftsub: { label: 'Letzter Gift-Sub', glyph: '♦' },
    };
    // seed demo defaults so a session has content
    this.latest.follower = { name: 'NOVA_PILOT', avatar: '' };
    this.latest.sub = { name: 'CMDRXATHAR', avatar: '', sub: 'TIER 1' };
    this.latest.resub = { name: 'QUANTUMFOX', avatar: '', sub: '14 MONATE' };
    this.latest.giftsub = { name: 'STARLORDHB', avatar: '', sub: 'x10 SUBS' };
    this.latestRunning = false;
    this.els.latest.style.opacity = '0';
    // teaser shortly after load, then a session every 10-15 min
    setTimeout(() => this.showLatestSession(), 4000);
    const schedule = () => {
      const ms = (10 + Math.random() * 5) * 60 * 1000;
      this.latestNext = setTimeout(() => { this.showLatestSession(); schedule(); }, ms);
    };
    schedule();
  }

  showLatestSession() {
    if (this.latestRunning) return;
    if (this.cShowing) { // don't clash with a compact alert; retry soon
      this.latestRetry = setTimeout(() => this.showLatestSession(), 8000);
      return;
    }
    const avail = this.latestOrder.filter(k => this.latest[k]);
    if (!avail.length) return;
    this.latestRunning = true;
    this.els.latest.style.opacity = '1';
    let i = 0;
    const showNext = () => {
      if (i >= avail.length) { this.hideLatestSession(); return; }
      this.renderLatest(avail[i], avail);
      i++;
      this.latestStep = setTimeout(showNext, 5000);
    };
    showNext();
  }

  hideLatestSession() {
    if (this.latestStep) { clearTimeout(this.latestStep); this.latestStep = null; }
    this.els.latest.style.opacity = '0';
    this.latestRunning = false;
  }

  updateLatest(type, data) {
    if (!this.latest) return;
    const name = (data.user || data.userName || data.displayName || '').toUpperCase();
    const avatar = data.avatar || data.profileImageUrl || '';
    if (!name) return;
    const amount = parseInt(data.amount || data.quantity || 0, 10);
    const months = parseInt(data.months || data.cumulativeMonths || 0, 10);
    const tier = data.tier === '2000' ? 'TIER 2' : data.tier === '3000' ? 'TIER 3' : 'TIER 1';
    if (type === 'follow') this.latest.follower = { name, avatar };
    else if (type === 'sub') this.latest.sub = { name, avatar, sub: tier };
    else if (type === 'resub') this.latest.resub = { name, avatar, sub: (months || 1) + ' MONATE' };
    else if (type === 'subgift' || type === 'subbomb' || type === 'giftbomb') this.latest.giftsub = { name, avatar, sub: 'x' + (amount || 1) + ' SUBS' };
    else return;
    // data refreshed silently; widget appears on its periodic session, not on every event
  }

  renderLatest(key, avail) {
    const E = this.els;
    const meta = this.latestMeta[key];
    const d = this.latest[key];
    // The widget frame is structure and stays Patina for every entry;
    // the name is Off White. Cycling the accent per entry type put a
    // second Copper element on screen and made the entry type legible
    // only by colour - the label already says which it is.
    E.latestLbl.textContent = meta.label;
    E.latestName.textContent = d.name;
    E.latestSub.textContent = d.sub || '';
    // avatar or glyph
    if (d.avatar) { E.latestAv.src = d.avatar; E.latestAv.style.display = 'block'; E.latestGlyph.style.display = 'none'; }
    else { E.latestAv.style.display = 'none'; E.latestGlyph.style.display = 'flex'; E.latestGlyph.textContent = meta.glyph; }
    // re-trigger entrance
    [E.latestLbl.parentElement, E.latestName, E.latestSub].forEach(el => {
      el.style.animation = 'none'; void el.offsetWidth;
      el.style.animation = 'ccLatestIn 0.45s ease-out backwards';
    });
    // dots
    E.latestDots.innerHTML = '';
    avail.forEach((k, i) => {
      const dot = document.createElement('div');
      const active = k === key;
      // This line carried the tail of a deleted box-shadow ternary
      // and was invalid CSS. Active is width plus opacity, not glow.
      dot.style.cssText = `height:3px; width:${active ? 22 : 9}px; background:${active ? '#4FB5B5' : 'rgba(79,181,181,0.25)'}; transition:width 0.3s, background 0.3s;`;
      E.latestDots.appendChild(dot);
    });
  }

  // ──────────────── WEBSOCKETS ────────────────
  connect() {
    const url = new URLSearchParams(location.search).get('sb') || 'ws://192.168.178.39:9090';
    this.dbg('WS → ' + url, 'info');
    try { this.ws = new WebSocket(url); } catch (e) { this.scheduleRetry(); return; }
    this.ws.onopen = () => { this.dbg('WS verbunden ✓', 'ok'); this.wsDelay = 1000; this.ws.send(JSON.stringify({ event: 'cc_alert_register' })); };
    this.ws.onmessage = (e) => this.handleMessage(e);
    this.ws.onclose = () => { this.dbg('WS getrennt – reconnect', 'warn'); this.scheduleRetry(); };
    this.ws.onerror = () => {};
  }
  scheduleRetry() {
    if (this.wsTimer) return;
    this.wsDelay = Math.min((this.wsDelay || 1000) * 2, 10000);
    this.wsTimer = setTimeout(() => { this.wsTimer = null; this.connect(); }, this.wsDelay);
  }
  handleMessage(evt) {
    try {
      const msg = JSON.parse(evt.data);
      const data = msg && msg.data || {};
      const source = ((msg && msg.event && msg.event.source) || '').toLowerCase();
      const type = ((msg && msg.event && msg.event.type) || '').toLowerCase();
      if (msg && msg.alertType) { this.enqueue(msg.alertType, msg); return; }
      if (source === 'general' && type === 'custom') { if (data.alertType) this.enqueue(data.alertType, data); return; }
      const map = { follow: 'follow', sub: 'sub', resub: 'resub', giftsub: 'subgift', giftbomb: 'subbomb', cheer: 'bits', redeem: 'redeem' };
      if (map[type]) this.enqueue(map[type], data);
    } catch (e) {}
  }
  // Admin test-console channel (alerts service WS). Only acts on synthetic
  // _test-flagged alerts so real events (via Streamerbot) never double-fire.
  connectAdmin() {
    const base = location.protocol + '//' + location.host;
    const url = base.replace(/^http/, 'ws') + '/alerts/ws';
    try { this.aws = new WebSocket(url); } catch (e) { this.scheduleAdminRetry(); return; }
    this.aws.onopen = () => { this.awsDelay = 1000; this.aws.send(JSON.stringify({ event: 'cc_identify', role: 'alerts-overlay' })); };
    this.aws.onmessage = (e) => {
      try { const m = JSON.parse(e.data); if (m && m._test && m.alertType) { this.dbg('TEST ← ' + m.alertType, 'info'); this.enqueue(m.alertType, m); } } catch (x) {}
    };
    this.aws.onclose = () => { this.scheduleAdminRetry(); };
    this.aws.onerror = () => {};
  }
  scheduleAdminRetry() {
    if (this.awsTimer) return;
    this.awsDelay = Math.min((this.awsDelay || 1000) * 2, 10000);
    this.awsTimer = setTimeout(() => { this.awsTimer = null; this.connectAdmin(); }, this.awsDelay);
  }
}

// Boot
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => new CCOverlay().init());
} else {
  new CCOverlay().init();
}
</script>
</body>
