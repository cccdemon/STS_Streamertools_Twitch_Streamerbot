<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>RDOC – Raumkampf</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="rdoc-brand.css">
<link rel="stylesheet" href="rdoc-overlay.css">
<style>
  /* OBS source canvas for this overlay. Everything else lives in
     rdoc-overlay.css — see the HUD rules at the top of that file.

     The page fills whatever source OBS gives it. #sf-root is a
     1920x1080 design space scaled to that source, and #sf-stage floats
     the 640x200 arena in the middle of it. The page used to BE 640x200,
     which pinned the duel to the top-left corner of any larger source.

     Set the OBS browser source to 1920x1080 or 2560x1440 - the overlay
     reads identically at both. */
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<!-- 1920x1080 design space, scaled to the real source. Everything the
     overlay draws lives inside it, so 1080p and 1440p look the same. -->
<div id="sf-root">

<!-- The stage is centred in the design space; the arena keeps its own
     fixed 640x200 coordinate system inside it. -->
<div id="sf-stage">
<div id="arena">
  <canvas id="sf-canvas" width="640" height="200"></canvas>
</div>

<!-- Station ident. The arena spends its one signet here, clear of
     both ships and of the Bestenliste at the opposite corner. -->
<div id="sf-ident">
  <span class="ov-signet ov-signet--sm" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="RDOC"><title>RDOC</title><g transform="translate(-60 -60) scale(0.3125)"><path fill="currentColor" d="M523.168,192.195 A320 320 0 0 1 784.845,344.8 L682.528,407.5 A200 200 0 0 0 518.98,312.122 Z M795.843,364.24 A320 320 0 0 1 799.614,652.279 L691.759,599.674 A200 200 0 0 0 689.402,419.65 Z M789.128,672 A320 320 0 0 1 657.277,797.122 L602.798,690.201 A200 200 0 0 0 685.205,612 Z M444.124,680 L579.876,680 L631.874,808.699 A320 320 0 0 1 586.703,823.158 L575.497,776.485 A272 272 0 0 0 589.252,772.799 L573.612,720 L450.388,720 L434.748,772.799 A272 272 0 0 0 448.503,776.485 L437.297,823.158 A320 320 0 0 1 392.126,808.699 Z M366.723,797.122 A320 320 0 0 1 234.872,672 L338.795,612 A200 200 0 0 0 421.202,690.201 Z M224.386,652.279 A320 320 0 0 1 228.157,364.24 L334.598,419.65 A200 200 0 0 0 332.241,599.674 Z M239.155,344.8 A320 320 0 0 1 500.832,192.195 L505.02,312.122 A200 200 0 0 0 341.472,407.5 Z"/></g></svg></span>
  <span class="ov-eyebrow ov-eyebrow--struct">RDOC // RAUMKAMPF</span>
</div>

</div>

<!-- Bestenliste. OUTSIDE the stage: it is fixed to the source corner,
     not to the centred arena field. A table, so its head is a section
     marker in Patina; rank 1 below is the single Copper element. -->
<div id="wof" class="ov-panel">
  <span class="ov-tick ov-tick--tr"></span>
  <div class="wof-header">
    BESTENLISTE
    <span class="wof-close" onclick="hideWoF()" title="Schliessen">&#x2715;</span>
  </div>
  <div id="wof-list"></div>
  <div class="wof-player-rank" id="wof-player-rank"></div>
</div>

</div>

<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var root = document.documentElement;

    // Fit the 1920x1080 design space to the real source, so a 1440p
    // source reads exactly like a 1080p one instead of 25% smaller.
    function fit() {
      root.style.setProperty('--sf-fit', window.innerWidth / 1920);
    }
    fit();
    window.addEventListener('resize', fit);

    // ?scale=2 doubles the duel. It scales the stage, not the arena's
    // 640x200 coordinate system, so nothing in spacefight.js has to
    // know about it - hit positions and separation are unaffected.
    var s = parseFloat(q.get('scale'));
    if (s > 0 && s <= 8) root.style.setProperty('--sf-scale', s);

    // ?wof=left mounts the leaderboard on the opposite edge.
    if ((q.get('wof') || '').toLowerCase() === 'left') {
      document.getElementById('wof').classList.add('wof-left');
    }
  })();
</script>
<script src="spacefight.js"></script>
</body>
</html>
