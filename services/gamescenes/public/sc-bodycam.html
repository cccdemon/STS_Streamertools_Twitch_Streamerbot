<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDOC – SC Bodycam</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="rdoc-brand.css">
<style>
/* ────────────────────────────────────────────────────────────
   RDOC – Bodycam scene transition (gamescenes)

   Brand layer: rdoc-brand.css above; data-theme="dark" keeps an
   OBS light preference from flipping the tokens.

   How colour is spent on ONE transition
   -------------------------------------
   Copper is spent exactly once, on the SIGNET, and on nothing
   else. Before this pass four separate elements carried it - the
   accent line, half the player name, the feed label and the
   signal bars once the link went static - which is four primary
   actions in a view that has none.
     - Signet        Copper, once, bottom right, 34px
     - Corners, signal bars, progress fill, accent line, HUD values
                     Patina. Structure.
     - Player name, CONNECTING
                     Off White. Michroma, one cut, tracking 0.
     - Link lost     Warning, and the label says LINK VERLOREN.
                     A state is never colour alone, and the bars
                     used to change to Copper with no word at all.

   The scanline layer and the vignette were a
   repeating-linear-gradient and a radial-gradient, so both are
   gone. The elements stay in the DOM as no-ops because the
   script toggles them by id and would throw on null.

   The greyscale noise canvas stays: it is the substance of the
   transition, procedurally drawn, and not one of the forbidden
   treatments (no gradient, glow, shadow, bevel, metal texture).

   Michroma has one cut and runs at tracking 0. It is ~1.35x
   wider than the old Bebas Neue, so the display sizes came down.
   Technical HUD labels are Plex Mono - that is the voice for
   anything a machine produced - at the overlay tracking of 0.3em.

   UI text is German, like every other surface in this stack.
   ──────────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:var(--rdoc-font-mono);}

#scale-root{
position:absolute;top:50%;left:50%;
width:1920px;height:1080px;
transform:translate(-50%,-50%) scale(var(--s,1));
}

#noise-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;opacity:1;transition:opacity .3s}
#noise-canvas.hidden{opacity:0}

/* Removed: repeating gradient. Kept as a no-op for the script. */
#scanlines{display:none}
#scanlines.hidden{display:none}

/* Removed: radial gradient. Kept as a no-op for the script. */
#vignette{display:none}
#vignette.hidden{display:none}

#hud{position:absolute;inset:0;z-index:10}

.corner{position:absolute;width:48px;height:48px;opacity:0;animation:cIn .25s .2s forwards}
.corner::before,.corner::after{content:'';position:absolute;background:var(--rdoc-accent-2)}
.corner::before{width:100%;height:2px}
.corner::after{width:2px;height:100%}
.corner.tl{top:40px;left:40px}
.corner.tr{top:40px;right:40px;transform:scaleX(-1)}
.corner.bl{bottom:40px;left:40px;transform:scaleY(-1)}
.corner.br{bottom:40px;right:40px;transform:scale(-1,-1)}
@keyframes cIn{to{opacity:1}}

#signal{position:absolute;top:48px;left:100px;display:flex;gap:3px;opacity:0;animation:fade .3s .3s forwards}
.bar{width:5px;background:var(--rdoc-accent-2)}
.bar:nth-child(1){height:8px}
.bar:nth-child(2){height:14px}
.bar:nth-child(3){height:20px}
.bar:nth-child(4){height:26px}
.bar.static{background:var(--rdoc-warning)}
#signal-label{font-family:var(--rdoc-font-mono);font-size:13px;letter-spacing:.3em;text-transform:uppercase;margin-left:9px;color:var(--rdoc-accent-2)}
#signal-label.static{color:var(--rdoc-warning)}

#bodycam-label{
position:absolute;top:44px;left:50%;
transform:translateX(-50%);
font-family:var(--rdoc-font-mono);font-size:14px;letter-spacing:.3em;
text-transform:uppercase;
color:var(--rdoc-accent-2);
opacity:0;animation:fade .3s .3s forwards
}

#hud-data{position:absolute;bottom:48px;right:60px;opacity:0;animation:fade .3s .4s forwards}
.hud-row{font-family:var(--rdoc-font-mono);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--rdoc-text-muted)}
.hud-row span{color:var(--rdoc-accent-2)}

#conn-wrap{
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
opacity:0;
animation:fade .3s .2s forwards,fadeOut .3s 1.7s forwards
}

#conn-text{font-family:var(--rdoc-font-display);font-size:44px;letter-spacing:0;color:var(--rdoc-text)}
#progress-track{width:400px;height:2px;background:var(--rdoc-graphite)}
#progress-fill{height:100%;width:0;background:var(--rdoc-accent-2);animation:progress 1.4s .2s forwards}

@keyframes progress{to{width:100%}}
@keyframes fade{to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}

#name-block{
position:absolute;bottom:90px;left:60px;
opacity:0;animation:fade .3s .5s forwards
}

#player-name{font-family:var(--rdoc-font-display);font-size:52px;letter-spacing:0;color:var(--rdoc-text)}

/* Structure, so Patina. This rule used to be Copper, which made it
   compete with the signet for the one accent. */
#accent-line{
height:2px;width:0;background:var(--rdoc-accent-2);
animation:line .4s .6s forwards
}

@keyframes line{to{width:300px}}

#switching-to{font-family:var(--rdoc-font-mono);font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--rdoc-text-muted)}

/* Station ident. The one signet of this scene. Standard cut at
   34px - never rendered below the 32px minimum, never animated. */
#ident{position:absolute;bottom:44px;right:60px;display:flex;align-items:center;gap:12px;
opacity:0;animation:fade .3s .5s forwards}
#ident .signet{display:block;width:34px;height:34px;flex-shrink:0;color:var(--rdoc-accent)}
#ident .signet svg{display:block;width:100%;height:100%}
#ident .label{font-family:var(--rdoc-font-mono);font-size:12px;letter-spacing:.3em;
text-transform:uppercase;color:var(--rdoc-text-muted)}

/* Motion is a preference, not a decision the overlay makes. */
@media (prefers-reduced-motion: reduce){
*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

</style>
</head>
<body>

<div id="scale-root">

<canvas id="noise-canvas"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>

<div id="hud">
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div id="signal">
<div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
<span id="signal-label">Link</span>
</div>

<div id="bodycam-label">Bodycam-Feed</div>

<div id="hud-data">
<div class="hud-row">Status <span>Aktiv</span></div>
</div>

<div id="name-block">
<div id="switching-to">Wechsel zu</div>
<div id="player-name"></div>
<div id="accent-line"></div>
</div>
</div>

<div id="conn-wrap">
<div id="conn-text">VERBINDE</div>
<div id="progress-track"><div id="progress-fill"></div></div>
</div>

<div id="ident">
<span class="signet" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="RDOC"><title>RDOC</title><g transform="translate(-60 -60) scale(0.3125)"><path fill="currentColor" d="M523.168,192.195 A320 320 0 0 1 784.845,344.8 L682.528,407.5 A200 200 0 0 0 518.98,312.122 Z M795.843,364.24 A320 320 0 0 1 799.614,652.279 L691.759,599.674 A200 200 0 0 0 689.402,419.65 Z M789.128,672 A320 320 0 0 1 657.277,797.122 L602.798,690.201 A200 200 0 0 0 685.205,612 Z M444.124,680 L579.876,680 L631.874,808.699 A320 320 0 0 1 586.703,823.158 L575.497,776.485 A272 272 0 0 0 589.252,772.799 L573.612,720 L450.388,720 L434.748,772.799 A272 272 0 0 0 448.503,776.485 L437.297,823.158 A320 320 0 0 1 392.126,808.699 Z M366.723,797.122 A320 320 0 0 1 234.872,672 L338.795,612 A200 200 0 0 0 421.202,690.201 Z M224.386,652.279 A320 320 0 0 1 228.157,364.24 L334.598,419.65 A200 200 0 0 0 332.241,599.674 Z M239.155,344.8 A320 320 0 0 1 500.832,192.195 L505.02,312.122 A200 200 0 0 0 341.472,407.5 Z"/></g></svg></span>
<span class="label">RDOC // Bodycam</span>
</div>

</div>

<script>
function fit(){
const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
document.getElementById('scale-root').style.setProperty('--s',s);
}
fit();window.addEventListener('resize',fit);

function setPlayer(){
// The name used to be split in half and the tail painted Copper.
// That is a second primary accent, and it is also a name cut in
// two for no reason a viewer can read. textContent also closes the
// injection hole the old innerHTML left on a URL parameter.
const p=new URLSearchParams(location.search).get('player')||'Jazzz';
document.getElementById('player-name').textContent=p;
}
setPlayer();

const c=document.getElementById('noise-canvas');
const ctx=c.getContext('2d');
c.width=1920;c.height=1080;

let run=true;
function noise(){
if(!run)return;
const d=ctx.createImageData(1920,1080);
for(let i=0;i<d.data.length;i+=4){
const v=Math.random()*255;
d.data[i]=v;
d.data[i+1]=v;
d.data[i+2]=v;
d.data[i+3]=255;
}
ctx.putImageData(d,0,0);
requestAnimationFrame(noise);
}
noise();

setTimeout(()=>{
run=false;
c.classList.add('hidden');
document.getElementById('scanlines').classList.add('hidden');
document.getElementById('vignette').classList.add('hidden');
document.getElementById('switching-to').style.display='none';
// Link lost is a STATE: Warning plus the word, never the colour
// alone. The bars used to turn Copper and say nothing.
document.querySelectorAll('.bar').forEach(b=>b.classList.add('static'));
const sl=document.getElementById('signal-label');
sl.classList.add('static');
sl.textContent='Link verloren';
},2000);
</script>

</body>
</html>
