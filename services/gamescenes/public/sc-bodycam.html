<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDOC – SC Bodycam</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="rdoc-brand.css">
<style>
/* ────────────────────────────────────────────────────────────
   RDOC – Bodycam scene transition (gamescenes)

   Brand layer: rdoc-brand.css above; data-theme="dark" keeps an
   OBS light preference from flipping the tokens.

   Strict brand pass: the scanline layer and the vignette were a
   repeating-linear-gradient and a radial-gradient, so both are
   gone. The elements stay in the DOM as no-ops because the
   script toggles them by id and would throw on null.

   The greyscale noise canvas stays: it is the substance of the
   transition, procedurally drawn, and not one of the forbidden
   treatments (no gradient, glow, shadow, bevel, metal texture).

   Michroma has one cut and runs at tracking 0. It is ~1.35x
   wider than the old Bebas Neue, so the display sizes came down.
   Technical HUD labels are Plex Mono - that is the voice for
   anything a machine produced.
   ──────────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:var(--rdoc-font-mono);}

#scale-root{
position:absolute;top:50%;left:50%;
width:1920px;height:1080px;
transform:translate(-50%,-50%) scale(var(--s,1));
}

#noise-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;opacity:1;transition:opacity .3s}
#noise-canvas.hidden{opacity:0}

/* Removed: repeating gradient. Kept as a no-op for the script. */
#scanlines{display:none}
#scanlines.hidden{display:none}

/* Removed: radial gradient. Kept as a no-op for the script. */
#vignette{display:none}
#vignette.hidden{display:none}

#hud{position:absolute;inset:0;z-index:10}

.corner{position:absolute;width:48px;height:48px;opacity:0;animation:cIn .25s .2s forwards}
.corner::before,.corner::after{content:'';position:absolute;background:var(--rdoc-accent-2)}
.corner::before{width:100%;height:2px}
.corner::after{width:2px;height:100%}
.corner.tl{top:40px;left:40px}
.corner.tr{top:40px;right:40px;transform:scaleX(-1)}
.corner.bl{bottom:40px;left:40px;transform:scaleY(-1)}
.corner.br{bottom:40px;right:40px;transform:scale(-1,-1)}
@keyframes cIn{to{opacity:1}}

#signal{position:absolute;top:48px;left:100px;display:flex;gap:3px;opacity:0;animation:fade .3s .3s forwards}
.bar{width:5px;background:var(--rdoc-accent-2)}
.bar:nth-child(1){height:8px}
.bar:nth-child(2){height:14px}
.bar:nth-child(3){height:20px}
.bar:nth-child(4){height:26px}
.bar.static{background:var(--rdoc-accent)}
#signal-label{font-family:var(--rdoc-font-mono);font-size:13px;letter-spacing:.07em;margin-left:7px;color:var(--rdoc-accent-2)}
#signal-label.static{color:var(--rdoc-accent)}

#bodycam-label{
position:absolute;top:44px;left:50%;
transform:translateX(-50%);
font-family:var(--rdoc-font-mono);font-size:14px;letter-spacing:.3em;
color:var(--rdoc-accent);
opacity:0;animation:fade .3s .3s forwards
}

#hud-data{position:absolute;bottom:48px;right:60px;opacity:0;animation:fade .3s .4s forwards}
.hud-row{font-family:var(--rdoc-font-mono);font-size:13px;letter-spacing:.07em;color:var(--rdoc-text-muted)}
.hud-row span{color:var(--rdoc-accent-2)}

#conn-wrap{
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
opacity:0;
animation:fade .3s .2s forwards,fadeOut .3s 1.7s forwards
}

#conn-text{font-family:var(--rdoc-font-display);font-size:44px;letter-spacing:0;color:var(--rdoc-text)}
#progress-track{width:400px;height:2px;background:var(--rdoc-graphite)}
#progress-fill{height:100%;width:0;background:var(--rdoc-accent-2);animation:progress 1.4s .2s forwards}

@keyframes progress{to{width:100%}}
@keyframes fade{to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}

#name-block{
position:absolute;bottom:90px;left:60px;
opacity:0;animation:fade .3s .5s forwards
}

#player-name{font-family:var(--rdoc-font-display);font-size:52px;letter-spacing:0;color:var(--rdoc-text)}
#player-name span{color:var(--rdoc-accent)}

#accent-line{
height:2px;width:0;background:var(--rdoc-accent);
animation:line .4s .6s forwards
}

@keyframes line{to{width:300px}}

#switching-to{font-family:var(--rdoc-font-mono);font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--rdoc-text-muted)}

</style>
</head>
<body>

<div id="scale-root">

<canvas id="noise-canvas"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>

<div id="hud">
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div id="signal">
<div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
<span id="signal-label">LINK</span>
</div>

<div id="bodycam-label">BODYCAM FEED</div>

<div id="hud-data">
<div class="hud-row">STATUS <span>ACTIVE</span></div>
</div>

<div id="name-block">
<div id="switching-to">SWITCHING TO</div>
<div id="player-name"></div>
<div id="accent-line"></div>
</div>
</div>

<div id="conn-wrap">
<div id="conn-text">CONNECTING</div>
<div id="progress-track"><div id="progress-fill"></div></div>
</div>

</div>

<script>
function fit(){
const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
document.getElementById('scale-root').style.setProperty('--s',s);
}
fit();window.addEventListener('resize',fit);

function setPlayer(){
const p=new URLSearchParams(location.search).get('player')||'Jazzz';
const mid=Math.floor(p.length/2)||1;
document.getElementById('player-name').innerHTML=
p.slice(0,mid)+"<span>"+p.slice(mid)+"</span>";
}
setPlayer();

const c=document.getElementById('noise-canvas');
const ctx=c.getContext('2d');
c.width=1920;c.height=1080;

let run=true;
function noise(){
if(!run)return;
const d=ctx.createImageData(1920,1080);
for(let i=0;i<d.data.length;i+=4){
const v=Math.random()*255;
d.data[i]=v;
d.data[i+1]=v;
d.data[i+2]=v;
d.data[i+3]=255;
}
ctx.putImageData(d,0,0);
requestAnimationFrame(noise);
}
noise();

setTimeout(()=>{
run=false;
c.classList.add('hidden');
document.getElementById('scanlines').classList.add('hidden');
document.getElementById('vignette').classList.add('hidden');
document.getElementById('switching-to').style.display='none';
document.querySelectorAll('.bar').forEach(b=>b.classList.add('static'));
document.getElementById('signal-label').classList.add('static');
},2000);
</script>

</body>
</html>
