<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streamerbot-Setup — Anleitung</title>
<style>
  :root{
    --cyan:#00d4ff; --cyan-dim:rgba(0,212,255,.55); --gold:#f0a500; --green:#00ff88;
    --bg:#04060a; --panel:#0a0e16; --txt:#c8dce8; --dim:rgba(200,220,232,.55); --line:rgba(0,212,255,.18);
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0} body{background:var(--bg);color:var(--txt);font-family:system-ui,'Segoe UI',sans-serif;line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 20px}
  .doc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px 30px}
  .doc h1{font-size:22px;color:var(--cyan);margin:.2em 0 .5em} .doc h2{font-size:16px;color:var(--cyan);margin:1.3em 0 .4em}
  .doc h3{font-size:14px;margin:1em 0 .3em} .doc p{margin:.5em 0} .doc ul{margin:.4em 0 .8em 1.2em} .doc li{margin:.2em 0}
  .doc a{color:var(--cyan)} .doc b{color:#e6f4fb}
  .doc blockquote{border-left:3px solid var(--cyan);margin:.8em 0;padding:.3em 0 .3em 14px;color:var(--dim);background:rgba(0,212,255,.04)}
  .doc code{background:#060a11;padding:1px 5px;border-radius:4px;font-size:.9em;font-family:var(--mono)}
  .doc pre{background:#060a11;padding:12px;border-radius:6px;overflow:auto;font-size:12px;font-family:var(--mono)}
  .doc table{width:100%;border-collapse:collapse;margin:.6em 0} .doc td,.doc th{border:1px solid var(--line);padding:6px 9px;text-align:left;font-size:13px}
  h2.sec{font-size:15px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin:26px 4px 12px}
  .act{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .act-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;background:linear-gradient(180deg,#0b1119,#080c13);border-bottom:1px solid var(--line)}
  .act-name{font-family:var(--mono);font-size:13px;color:var(--cyan);letter-spacing:.5px}
  .act button{font-family:var(--mono);font-size:11px;letter-spacing:1px;cursor:pointer;color:#05121a;background:var(--cyan);border:none;padding:6px 12px;border-radius:5px;font-weight:700}
  .act button.ok{background:var(--green)}
  .act pre{margin:0;padding:14px 16px;overflow:auto;font-family:var(--mono);font-size:12px;color:var(--txt);max-height:340px}
  .err{color:#ff5468}
</style>
</head>
<body>
<div class="wrap"><div class="doc" id="doc">lädt…</div></div>
<div class="wrap">
  <h2 class="sec">Streamerbot-Actions (C#) — zum Kopieren</h2>
  <div id="actions"><div style="color:var(--dim);font-size:13px">lädt…</div></div>
</div>
<script>
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function inline(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');}
  function mdToHtml(md){
    var lines=String(md).split(/\r?\n/),out=[],inList=false,inCode=false,inTable=false;
    function cl(){if(inList){out.push('</ul>');inList=false;}}
    function ct(){if(inTable){out.push('</table>');inTable=false;}}
    for(var i=0;i<lines.length;i++){var l=lines[i];
      if(/^```/.test(l)){cl();ct();if(inCode){out.push('</pre>');inCode=false;}else{out.push('<pre>');inCode=true;}continue;}
      if(inCode){out.push(esc(l));continue;}
      if(/^\s*\|/.test(l)){ if(/^\s*\|[\s:|-]+\|?\s*$/.test(l))continue; cl(); if(!inTable){out.push('<table>');inTable=true;}
        var cells=l.replace(/^\s*\||\|\s*$/g,'').split('|'); out.push('<tr>'+cells.map(function(c){return '<td>'+inline(c.trim())+'</td>';}).join('')+'</tr>'); continue; }
      ct();
      var h=l.match(/^(#{1,4})\s+(.*)/); if(h){cl();var n=h[1].length;out.push('<h'+n+'>'+inline(h[2])+'</h'+n+'>');continue;}
      if(/^\s*[-*]\s+/.test(l)){if(!inList){out.push('<ul>');inList=true;}out.push('<li>'+inline(l.replace(/^\s*[-*]\s+/,''))+'</li>');continue;}
      if(/^\s*\d+\.\s+/.test(l)){if(!inList){out.push('<ul>');inList=true;}out.push('<li>'+inline(l.replace(/^\s*\d+\.\s+/,''))+'</li>');continue;}
      if(/^\s*>\s?/.test(l)){cl();out.push('<blockquote>'+inline(l.replace(/^\s*>\s?/,''))+'</blockquote>');continue;}
      if(/^\s*$/.test(l)){cl();continue;} cl();out.push('<p>'+inline(l)+'</p>');
    }
    cl();ct();if(inCode)out.push('</pre>');return out.join('\n');
  }
  fetch('/admin/pub/doc/setup').then(function(r){return r.json();}).then(function(d){
    document.getElementById('doc').innerHTML=d.content?mdToHtml(d.content):'<span class="err">Nicht verfügbar.</span>';
  }).catch(function(){document.getElementById('doc').innerHTML='<span class="err">Ladefehler.</span>';});

  fetch('/admin/pub/actions').then(function(r){return r.json();}).then(function(list){
    var host=document.getElementById('actions');
    if(!Array.isArray(list)||!list.length){host.innerHTML='<div class="err">Actions nicht verfügbar.</div>';return;}
    host.innerHTML=list.map(function(a,i){
      return '<div class="act"><div class="act-head"><span class="act-name">'+esc(a.name)+'</span>'
        +'<button data-i="'+i+'">Kopieren</button></div><pre id="code'+i+'">'+esc(a.code)+'</pre></div>';
    }).join('');
    Array.prototype.forEach.call(host.querySelectorAll('button[data-i]'),function(b){
      b.addEventListener('click',function(){ var i=b.getAttribute('data-i'); var code=list[i].code;
        (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(function(){
          b.textContent='Kopiert ✓'; b.classList.add('ok'); setTimeout(function(){b.textContent='Kopieren';b.classList.remove('ok');},1500);
        }).catch(function(){ var r=document.createRange();r.selectNode(document.getElementById('code'+i));
          getSelection().removeAllRanges();getSelection().addRange(r); });
      });
    });
  }).catch(function(){document.getElementById('actions').innerHTML='<div class="err">Actions-Ladefehler.</div>';});
</script>
</body>
</html>
