<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein Giveaway-Status</title>
<style>
  :root{
    --void:#05070c; --panel:#0a0e16; --edge:rgba(0,212,255,.16);
    --cyan:#00d4ff; --cyan-dim:rgba(0,212,255,.55); --gold:#f0a500; --green:#00ff88;
    --ink:#c8dce8; --mute:rgba(200,220,232,.5);
    --disp:"Segoe UI Semibold","Segoe UI",system-ui,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--void);color:var(--ink);font-family:var(--mono);min-height:100vh;
    background-image:radial-gradient(120% 60% at 50% -5%,rgba(0,212,255,.06),transparent 60%)}
  .wrap{max-width:720px;margin:0 auto;padding:34px 20px 80px}
  .kicker{font-size:11px;letter-spacing:3px;color:var(--cyan-dim);text-transform:uppercase}
  h1{font-family:var(--disp);font-weight:700;font-size:clamp(22px,4vw,30px);margin:6px 0 3px;color:#eaf6fc}
  .sub{font-size:13px;color:var(--mute);margin-bottom:22px}
  .who{font-size:13px;color:var(--cyan);margin-bottom:18px}
  .who b{color:#eaf6fc}
  .twbtn{display:inline-block;background:#9146FF;color:#fff;padding:13px 22px;border-radius:8px;
    font-weight:700;letter-spacing:.5px;text-decoration:none;margin-top:8px}
  .card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:18px 20px;margin-bottom:14px}
  .chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .tname{font-family:var(--disp);font-weight:700;font-size:17px;color:#eaf6fc}
  .badge{font-size:10px;letter-spacing:1.5px;padding:3px 9px;border-radius:5px;text-transform:uppercase}
  .badge.in{background:rgba(0,255,136,.13);color:var(--green)}
  .badge.near{background:rgba(240,165,0,.14);color:var(--gold)}
  .badge.out{background:rgba(200,220,232,.08);color:var(--mute)}
  .badge.paused{background:rgba(240,165,0,.14);color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat{background:#060a11;border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:12px 14px}
  .stat .l{font-size:10px;letter-spacing:1.5px;color:var(--mute);text-transform:uppercase}
  .stat .v{font-family:var(--disp);font-weight:700;font-size:22px;margin-top:4px;color:var(--cyan);font-variant-numeric:tabular-nums}
  .stat.chance .v{color:var(--gold)}
  .hint{font-size:12px;color:var(--mute);margin-top:12px;line-height:1.5}
  .hint b{color:var(--cyan-dim)}
  .empty,.err{color:var(--mute);font-size:14px;line-height:1.6}
  .err{color:#ff5468}
  @media(max-width:520px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Team Giveaway</div>
  <h1>Mein Status</h1>
  <div class="sub">Deine Zuschauzeit und Gewinnchance für alle Giveaways, an denen du teilnimmst.</div>
  <div id="body"><div class="empty">lädt…</div></div>
</div>
<script>
  var body = document.getElementById('body');
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmtTime(sec){ sec=Math.round(sec||0); var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);
    return h>0 ? h+'h '+m+'m' : m>0 ? m+'m' : (sec+'s'); }
  function twitch(){ location.href='/admin/auth/twitch?next=/admin/status.html'; }

  function loginView(){
    body.innerHTML = '<div class="empty">Melde dich mit Twitch an, um deinen Status zu sehen.</div>'
      + '<a class="twbtn" href="#" onclick="twitch();return false;">Mit Twitch anmelden</a>';
  }

  function render(data){
    var who = '<div class="who">Angemeldet als <b>'+esc(data.login)+'</b> · '
      + '<a href="#" style="color:var(--mute)" onclick="logout();return false;">abmelden</a></div>';
    if(!data.teams || !data.teams.length){
      body.innerHTML = who + '<div class="empty">Du nimmst gerade an keinem Giveaway teil.<br>'
        + 'Folge ≥2 Kanälen eines Teams, schau zu, schreib sinnvoll im Chat und aktiviere per Keyword.</div>';
      return;
    }
    body.innerHTML = who + data.teams.map(card).join('');
  }

  function card(t){
    var badge, cls;
    if(t.paused){ badge='pausiert'; cls='paused'; }
    else if(t.eligible){ badge='Im Lostopf ✅'; cls='in'; }
    else if(t.registered){ badge='fast dabei'; cls='near'; }
    else { badge='noch nicht dabei'; cls='out'; }
    var chanceVal = t.eligible ? t.chance.toFixed(1)+'%' : '—';
    var hint;
    if(t.eligible) hint='Du bist im Lostopf. Mehr Zuschauzeit + Chat erhöhen deine Chance.';
    else if(t.registered && t.channelsQualified<2) hint='Du hast teilgenommen, aber erst '+t.channelsQualified+' Kanal gültig — folge & sammle auf mind. 2 Kanälen.';
    else if(!t.registered) hint='Schreib das Keyword im Chat, um deine Teilnahme abzugeben.';
    else hint='';
    return '<div class="card"><div class="chead"><span class="tname">'+esc(t.name)+'</span>'
      + '<span class="badge '+cls+'">'+badge+'</span></div>'
      + '<div class="grid">'
      + '<div class="stat"><div class="l">Zuschauzeit</div><div class="v">'+fmtTime(t.watchSec)+'</div></div>'
      + '<div class="stat"><div class="l">Kanäle</div><div class="v">'+t.channelsQualified+'/2</div></div>'
      + '<div class="stat chance"><div class="l">Gewinnchance</div><div class="v">'+chanceVal+'</div></div>'
      + '</div>' + (hint?'<div class="hint">'+esc(hint)+'</div>':'') + '</div>';
  }

  function logout(){ fetch('/admin/auth/logout',{method:'POST'}).catch(function(){}).then(function(){ loginView(); }); }

  (async function(){
    try{
      var me = await fetch('/admin/auth/me');
      if(me.status===401){ loginView(); return; }
      var st = await fetch('/giveaway/api/my-status');
      if(st.status===401){ loginView(); return; }
      var data = await st.json();
      render(data);
    }catch(e){ body.innerHTML='<div class="err">Ladefehler. Bitte später erneut.</div>'; }
  })();
</script>
</body>
</html>
