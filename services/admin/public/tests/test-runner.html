<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>RDOC – Test Suite</title>
<link rel="icon" href="/admin/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/admin/favicon.ico" sizes="any">
<link rel="stylesheet" href="/admin/rdoc-brand.css">
<link rel="stylesheet" href="/admin/rdoc-admin.css">
<style>
  /* Page-local layout only. Colour and type come from the RDOC
     tokens loaded above; pass/fail are states, so they use the
     functional colours and always carry the word PASS or FAIL. */
  body { padding: 24px; }
  h1 { font-family: var(--display); font-size: 20px; letter-spacing: 0; margin-bottom: 12px; }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--dim); margin-bottom: 24px; }
  .summary { padding: 12px 16px; margin-bottom: 18px; display: inline-flex; gap: 12px; align-items: center; font-family: var(--mono); font-size: 13px; border: 1px solid; }
  .summary.pass { border-color: color-mix(in srgb, var(--ok) 45%, transparent);  color: var(--ok); }
  .summary.fail { border-color: color-mix(in srgb, var(--err) 45%, transparent); color: var(--err); }
  #test-results { max-width: 1000px; }
  .test-case { border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; }
  .test-case.pass { border-color: color-mix(in srgb, var(--ok) 30%, var(--border)); }
  .test-case.fail { border-color: color-mix(in srgb, var(--err) 40%, var(--border)); }
  .test-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg3); }
  .test-name { font-weight: 600; }
  .test-status { font-family: var(--mono); font-size: 12px; letter-spacing: 0.07em; text-transform: uppercase; }
  .test-case.pass .test-status { color: var(--ok); }
  .test-case.fail .test-status { color: var(--err); }
  .test-body { padding: 10px 14px; font-family: var(--mono); font-size: 13px; white-space: pre-wrap; background: var(--bg2); }
</style>
</head>
<body>
<script src="/admin/admin-shared.js"></script>
<script>window._sfUnitTests = true;</script>
<script src="/spacefight/spacefight.js"></script>
<header>
  <h1>RDOC // <span>Test Suite</span></h1>
  <div class="subtitle">Browser-Unit-Tests für Shared Utilities und Navigation</div>
</header>
<div class="subtitle">
  Diese Suite testet ausschließlich Client-seitige Utility-Funktionen. Es werden keine echten Spacefight- oder Streamer.bot-Daten verändert.
</div>
<div id="summary" class="summary pass">Tests werden ausgeführt...</div>
<div id="test-results"></div>
<script src="test-suite.js"></script>
</body>
</html>
